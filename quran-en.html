
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quran English Translation with Audio</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--border:#334155}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal';transition:.3s}
.header{position:sticky;top:0;z-index:99;background:var(--card);border-bottom:1px solid var(--border);padding:10px}
.top{max-width:950px;margin:auto;display:flex;gap:6px;flex-wrap:wrap}
button{border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:9px 12px;cursor:pointer;font-weight:bold}
.container{max-width:950px;margin:auto;padding:14px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.surah{background:var(--card);border:1px solid var(--border);padding:12px;border-radius:12px;text-align:center;cursor:pointer}
#reader{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;line-height:2.2;font-size:18px;display:none;direction:ltr;text-align:left}
.ayah{display:block;padding:10px;border-radius:8px;cursor:pointer;margin-bottom:6px;border-bottom:1px solid var(--border)}
.ayah.active{background:#22c55e;color:#000}
.ayah-num{font-size:12px;opacity:.6;margin-left:6px}
#info{max-width:950px;margin:6px auto 0;font-size:12px;opacity:.7}
</style>
</head>
<body>
<div class="header">
<div class="top">
<button onclick="showList()">📚 Surahs</button>
<button onclick="location.href='quran.html'">العربية</button>
<button onclick="stopSpeech()">⏹ Stop</button>
</div>
<div id="info">Click any verse to listen to English translation</div>
</div>
<div class="container"><div id="list" class="list"></div><div id="reader"></div></div>
<script>
const listEl=document.getElementById('list'), readerEl=document.getElementById('reader');
let ayahs=[], cur=-1;
async function init(){const r=await fetch('https://api.alquran.cloud/v1/surah'); const j=await r.json(); renderList(j.data);}
function renderList(data){listEl.innerHTML=''; data.forEach(s=>{const d=document.createElement('div'); d.className='surah'; d.textContent=s.englishName+' - '+s.number; d.onclick=()=>loadSurah(s.number); listEl.appendChild(d);});}
init();
function showList(){readerEl.style.display='none'; listEl.style.display='grid'; speechSynthesis.cancel();}
async function loadSurah(num){listEl.style.display='none'; readerEl.style.display='block'; readerEl.innerHTML='Loading...'; try{const res=await fetch(`https://api.alquran.cloud/v1/surah/${num}/en.sahih`).then(r=>r.json()); ayahs=res.data.ayahs; draw();}catch(e){readerEl.innerHTML='No internet';}}
function draw(){let html=`<h3>${ayahs[0].surah.englishName}</h3>`; ayahs.forEach((a,i)=>{html+=`<span class="ayah" id="a-${i}" onclick="playEn(${i})">${a.text} <span class="ayah-num">[${a.numberInSurah}]</span></span>`;}); readerEl.innerHTML=html;}
function playEn(i){cur=i; document.querySelectorAll('.ayah').forEach(e=>e.classList.remove('active')); const el=document.getElementById(`a-${i}`); if(el){el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'center'});} const utter=new SpeechSynthesisUtterance(ayahs[i].text); utter.lang='en-US'; utter.rate=0.9; utter.onend=()=>{if(cur+1<ayahs.length) playEn(cur+1)}; speechSynthesis.cancel(); speechSynthesis.speak(utter);}
function stopSpeech(){speechSynthesis.cancel();}
</script>
</body>
</html>
