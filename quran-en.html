<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran English Translation & Audio</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b1222;
      --card-bg: #0f172a;
      --panel-bg: #1e293b;
      --border-color: #334155;
      --accent-green: #22c55e;
      --accent-gold: #facc15;
      --accent-blue: #38bdf8;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Navigation Bar */
    .top-nav {
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      position: sticky;
      top: 0;
      z-index: 50;
      display: flex;
      gap: 10px;
      align-items: center;
      overflow-x: auto;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .top-nav a {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      transition: all 0.2s;
    }

    .top-nav a.active, .top-nav a:hover {
      background: var(--accent-green);
      color: #000;
      border-color: var(--accent-green);
    }

    /* Audio Player Bar */
    .audio-container {
      background: var(--card-bg);
      padding: 10px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: center;
      align-items: center;
    }
