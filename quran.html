<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  body{font-family:'Amiri',serif;background:#0f172a;color:#f1f5f9;margin:0;padding:20px}
  .container{max-width:900px;margin:auto}
  h1{text-align:center;color:#f8fafc;margin:30px 0}
  .surah-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .surah{background:#1e293b;padding:15px;border-radius:12px;cursor:pointer;text-align:center;transition:.2s;border:1px solid #334155}
  .surah:hover{background:#334155;transform:scale(1.03)}
  .surah span{display:block;font-size:14px;color:#94a3b8}
  #reader{display:none;background:#1e293b;padding:25px;border-radius:16px;margin-top:20px;line-height:2.2;font-size:24px;border:1px solid #334155}
  #reader button{background:#22c55e;color:#000;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;margin-bottom:15px}
  audio{width:100%;margin-top:15px}
</style>
</head>
<body>
<div class="container">
  <h1>📖 القرآن الكريم</h1>
  <div id="surahs" class="surah-list">جاري التحميل...</div>
  <div id="reader"></div>
</div>
<script>
const surahsDiv = document.getElementById('surahs');
const readerDiv = document.getElementById('reader');

fetch('https://api.alquran.cloud/v1/surah')
.then(r=>r.json()).then(data=>{
  surahsDiv.innerHTML='';
  data.data.forEach(s=>{
    const d=document.createElement('div');
    d.className='surah';
    d.innerHTML=`${s.name} <span>${s.englishName} - ${s.numberOfAyahs} آية</span>`;
    d.onclick=()=>loadSurah(s.number);
    surahsDiv.appendChild(d);
  });
});

function loadSurah(num){
  readerDiv.style.display='block';
  readerDiv.innerHTML='جاري تحميل السورة...';
  window.scrollTo(0,0);
  fetch(`https://api.alquran.cloud/v1/surah/${num}/ar.alafasy`)
  .then(r=>r.json()).then(res=>{
    const s=res.data;
    let html=`<button onclick="document.getElementById('reader').style.display='none'">← رجوع للقائمة</button>`;
    html+=`<h2>${s.name} - ${s.englishName}</h2>`;
    s.ayahs.forEach(a=>{
      html+=`<span>${a.text} ﴿${a.numberInSurah}﴾ </span>`;
    });
    html+=`<audio controls src="https://cdn.islamic.network/quran/audio-surah/128/ar.alafasy/${num}.mp3"></audio>`;
    readerDiv.innerHTML=html;
  });
}
</script>
</div>
</body>
</html>
