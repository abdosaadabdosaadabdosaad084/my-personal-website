<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#e2e8f0;--border:#334155}
body.light{--bg:#f8fafc;--card:#ffffff;--text:#0f172a;--border:#e2e8f0}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--text);font-family:'Tajawal';transition:.3s}
.header{position:sticky;top:0;z-index:99;background:var(--card);border-bottom:1px solid var(--border);padding:10px}
.top{max-width:950px;margin:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
select,audio,button{border-radius:10px;border:1px solid var(--border);background:var(--bg);color:var(--text);padding:9px 10px}
audio{flex:1;min-width:180px;height:40px} select{min-width:110px}
button{cursor:pointer;background:var(--border);font-weight:bold}
button.active{background:#22c55e;color:black}
.font-btn{width:42px}
#info{max-width:950px;margin:6px auto 0;font-size:12px;opacity:.7}
.container{max-width:950px;margin:auto;padding:14px}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.surah{background:var(--card);border:1px solid var(--border);padding:12px;border-radius:12px;text-align:center;cursor:pointer}
#reader{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px;line-height:2.8;font-family:'Amiri';font-size:26px;display:none}
.ayah{padding:6px 8px;border-radius:8px;cursor:pointer}.ayah.active{background:#22c55e;color:#000}
.word{cursor:pointer;padding:2px 4px;border-radius:6px}.word:hover{background:#fbbf24;color:#000}
.ayah-num{font-family:'Tajawal';font-size:12px;opacity:.6}
#tafsirBox{position:fixed;bottom:0;left:0;right:0;background:white;color:black;border-radius:20px 20px 0 0;padding:18px 18px 30px;box-shadow:0 -10px 30px rgba(0,0,0,.4);max-height:65vh;overflow-y:auto;display:none;z-index:999;line-height:1.7}
#tafsirBox b{font-size:19px;display:block;margin-bottom:6px}
#tafsirBox.ar{font-size:16px;color:#1e293b;margin-bottom:12px;border-bottom:1px solid #eee;padding-bottom:10px;display:block}
#tafsirBox.en{font-size:14px;color:#475569;direction:ltr;text-align:left;display:block}
#tafsirBox.close{position:absolute;top:10px;left:14px;background:#0f172a;color:white;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer}
</style>
</head>
<body>
<div class="header">
<div class="top">
<button onclick="showList()">📚 السور</button>
<button onclick="toggleTheme()" id="themeBtn">🌙 ليلي</button>
<select id="reciter" onchange="changeReciter()"><option value="ar.alafasy">العفاسي</option><option value="ar.husary">الحصري</option><option value="ar.abdulbasitmurattal">عبد الباسط</option></select>
<audio id="audio" controls></audio>
<button class="font-btn" onclick="changeFont(2)">A+</button><button class="font-btn" onclick="changeFont(-2)">A-</button>
<button onclick="cacheCurrentSurah()">💾</button>
</div>
<div id="info">دوس على أي كلمة = تفسير عربي + ترجمة انجليزية</div>
</div>
<div class="container"><div id="list" class="list"></div><div id="reader"></div></div>
<div id="tafsirBox"><div class="close" onclick="hideTafsir()">×</div><b id="tWord"></b><span class="ar" id="tAr"></span><span class="en" id="tEn"></span></div>
<script>
const listEl=document.getElementById('list'), readerEl=document.getElementById('reader'), audio=document.getElementById('audio'), reciterSel=document.getElementById('reciter');
const tBox=document.getElementById('tafsirBox'), tWord=document.getElementById('tWord'), tAr=document.getElementById('tAr'), tEn=document.getElementById('tEn');
let ayahs=[], cur=-1, curSurahNum=0, curSurahName='', currentReciter=localStorage.getItem('reciter')||'ar.alafasy'; reciterSel.value=currentReciter;
let fontSize=parseInt(localStorage.getItem('quran_font')||'26'); function applyFont(){readerEl.style.fontSize=fontSize+'px'} applyFont();
function changeFont(n){fontSize+=n; if(fontSize<18)fontSize=18; if(fontSize>52)fontSize=52; applyFont(); localStorage.setItem('quran_font',fontSize);}
let theme=localStorage.getItem('theme')||'dark'; if(theme==='light') document.body.classList.add('light'); updateThemeBtn();
function toggleTheme(){document.body.classList.toggle('light'); theme=document.body.classList.contains('light')?'light':'dark'; localStorage.setItem('theme',theme); updateThemeBtn();}
function updateThemeBtn(){document.getElementById('themeBtn').textContent=theme==='light'?'🌙 ليلي':'☀️ نهاري';}
function showTafsir(word,ayahNum){
 tWord.textContent=`كلمة: ${word}`; tAr.textContent='⏳ جاري تحميل التفسير...'; tEn.textContent='Loading English translation...'; tBox.style.display='block';
 fetch(`https://api.alquran.cloud/v1/ayah/${ayahNum}/ar.muyassar`).then(r=>r.json()).then(j=>{ if(j.data){ tAr.textContent=j.data.text; localStorage.setItem(`tafsir_${ayahNum}`,j.data.text);} }).catch(()=>{ let c=localStorage.getItem(`tafsir_${ayahNum}`); tAr.textContent=c||'لا يوجد نت'; });
 fetch(`https://api.alquran.cloud/v1/ayah/${ayahNum}/en.sahih`).then(r=>r.json()).then(j=>{ if(j.data){ tEn.textContent=j.data.text; localStorage.setItem(`en_${ayahNum}`,j.data.text);} }).catch(()=>{ let c=localStorage.getItem(`en_${ayahNum}`); tEn.textContent=c||''; });
}
function hideTafsir(){tBox.style.display='none';}
async function init(){try{let d=localStorage.getItem('surah_list'); if(d){d=JSON.parse(d)}else{const r=await fetch('https://api.alquran.cloud/v1/surah'); const j=await r.json(); d=j.data; localStorage.setItem('surah_list',JSON.stringify(d));} renderList(d);}catch(e){const c=localStorage.getItem('surah_list'); if(c) renderList(JSON.parse(c));}}
function renderList(data){listEl.innerHTML=''; data.forEach(s=>{const d=document.createElement('div'); d.className='surah'; d.innerHTML=`${s.name}<br><small>${s.number}</small>`; d.onclick=()=>loadSurah(s.number,s.name); listEl.appendChild(d);});}
init();
function showList(){readerEl.style.display='none'; listEl.style.display='grid'; audio.pause(); hideTafsir();}
function changeReciter(){currentReciter=reciterSel.value; localStorage.setItem('reciter',currentReciter); if(curSurahNum) loadSurah(curSurahNum,curSurahName);}
async function loadSurah(num,name){curSurahNum=num; curSurahName=name; listEl.style.display='none'; readerEl.style.display='block'; applyFont(); hideTafsir(); const key=`surah_${num}_${currentReciter}`; const cached=localStorage.getItem(key); if(cached){ayahs=JSON.parse(cached); drawAyahs(); playAyah(0); return;} try{const res=await fetch(`https://api.alquran.cloud/v1/surah/${num}/${currentReciter}`).then(r=>r.json()); ayahs=res.data.ayahs; localStorage.setItem(key,JSON.stringify(ayahs)); drawAyahs(); playAyah(0);}catch(e){readerEl.innerHTML='مفيش نت';}}
function drawAyahs(){let html=''; ayahs.forEach((a,i)=>{let words=a.text.split(' ').map(w=>`<span class="word" onclick="event.stopPropagation(); showTafsir('${w.replace(/'/g,"").slice(0,15)}',${a.number})">${w}</span>`).join(' '); html+=`<span class="ayah" id="a-${i}" onclick="playAyah(${i})">${words} <span class="ayah-num">﴿${a.numberInSurah}﴾</span></span> `;}); readerEl.innerHTML=html;}
function playAyah(i){if(i<0||i>=ayahs.length)return; cur=i; document.querySelectorAll('.ayah').forEach(e=>e.classList.remove('active')); const el=document.getElementById(`a-${i}`); if(el){el.classList.add('active'); el.scrollIntoView({behavior:'smooth',block:'center'});} audio.src=ayahs[i].audio; audio.play().catch(()=>{});}
audio.onended=()=>{ if(cur+1<ayahs.length) playAyah(cur+1); };
async function cacheCurrentSurah(){}
</script>
</body>
</html>
