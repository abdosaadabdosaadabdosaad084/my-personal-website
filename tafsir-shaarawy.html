<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>خواطر الشعراوي - كأنك سامعه</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff;font-family:Tahoma,system-ui}
.top{display:flex;gap:6px;position:sticky;top:0;background:#0f172aee;backdrop-filter:blur(8px);z-index:30;padding:12px;border-bottom:1px solid #1e293b;overflow-x:auto}
.top a{background:#1e293b;padding:9px 14px;border-radius:10px;color:#fff;text-decoration:none;font-size:13px;white-space:nowrap}
.top a.active{background:#22c55e;color:#000;font-weight:bold}
.hero{background:linear-gradient(135deg,#064e3b,#022c22);padding:28px 20px;text-align:center;border-bottom:2px solid #facc1530}
.hero h1{margin:0;color:#facc15;font-size:26px}
.hero h1 span{color:#22c55e}
.hero p{color:#a7f3d0;margin-top:10px;line-height:1.8;font-size:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:800px;margin:14px auto;padding:0 12px}
.card{background:#1e293b;padding:14px;border-radius:12px;text-align:center;border:1px solid #334155;cursor:pointer}
.search{max-width:800px;margin:12px auto;padding:0 12px}
.search input{width:100%;background:#1e293b;border:1px solid #334155;color:#fff;padding:14px;border-radius:12px;font-size:15px}
#reader{display:none;position:fixed;inset:0;background:#0f172a;z-index:100;overflow-y:auto;padding:12px}
.ayah-box{background:linear-gradient(135deg,#1e293b,#1e293b);border-radius:16px;padding:18px;margin:16px 0;border:1px solid #334155;position:relative}
.ayah-box::before{content:'🎙️ الشعراوي';position:absolute;top:-10px;right:16px;background:#facc15;color:#000;font-size:10px;font-weight:bold;padding:3px 10px;border-radius:20px}
.ayah-text{font-size:25px;line-height:2.3;color:#fff;text-align:center;padding:10px;background:#0f172a;border-radius:12px;border:1px solid #33415530}
.shaarawy-text{margin-top:14px;color:#e2e8f0;line-height:2.1;font-size:17px;background:#0f172a;padding:14px;border-radius:12px;border-right:4px solid #facc15}
.shaarawy-text b{color:#facc15}
.shaarawy-text.hook{color:#22c55e;font-weight:bold}
</style>
</head>
<body>
<div class="top">
<a href="index.html">🏠 الرئيسية</a>
<a href="quran-ar.html">🇸🇦 قرآن</a>
<a class="active">🎙️ خواطر الشعراوي</a>
</div>
<div class="hero">
<h1>🎙️ <span>خواطر</span> الشعراوي</h1>
<p>تفسير مكتوب كأن الشيخ قدامك بيكلمك<br>بنفس أسلوبه: "الحق سبحانه وتعالى..." - "خد بالك..." - "شوف بقى..."</p>
</div>
<div class="search"><input id="search" placeholder="🔍 دور على سورة..." oninput="render()"></div>
<div class="grid" id="list"></div>
<div id="reader">
<div style="position:sticky;top:0;background:#0f172aee;padding:12px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #1e293b;z-index:10">
<button onclick="closeReader()" style="background:#facc15;border:0;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer;color:#000">⬅ رجوع</button>
<span id="sname" style="font-weight:bold"></span>
</div>
<div style="max-width:800px;margin:0 auto;padding:10px" id="content"></div>
</div>
<script>
const surahs=[["الفاتحة",1],["البقرة",2],["آل عمران",3],["النساء",4],["المائدة",5],["الأنعام",6],["الأعراف",7],["الأنفال",8],["التوبة",9],["يونس",10],["هود",11],["يوسف",12],["الرعد",13],["إبراهيم",14],["الحجر",15],["النحل",16],["الإسراء",17],["الكهف",18],["مريم",19],["طه",20],["الأنبياء",21],["الحج",22],["المؤمنون",23],["النور",24],["الفرقان",25],["الشعراء",26],["النمل",27],["القصص",28],["العنكبوت",29],["الروم",30],["لقمان",31],["السجدة",32],["الأحزاب",33],["سبأ",34],["فاطر",35],["يس",36],["الصافات",37],["ص",38],["الزمر",39],["غافر",40],["فصلت",41],["الشورى",42],["الزخرف",43],["الدخان",44],["الجاثية",45],["الأحقاف",46],["محمد",47],["الفتح",48],["الحجرات",49],["ق",50],["الذاريات",51],["الطور",52],["النجم",53],["القمر",54],["الرحمن",55],["الواقعة",56],["الحديد",57],["المجادلة",58],["الحشر",59],["الممتحنة",60],["الصف",61],["الجمعة",62],["المنافقون",63],["التغابن",64],["الطلاق",65],["التحريم",66],["الملك",67],["القلم",68],["الحاقة",69],["المعارج",70],["نوح",71],["الجن",72],["المزمل",73],["المدثر",74],["القيامة",75],["الإنسان",76],["المرسلات",77],["النبأ",78],["النازعات",79],["عبس",80],["التكوير",81],["الانفطار",82],["المطففين",83],["الانشقاق",84],["البروج",85],["الطارق",86],["الأعلى",87],["الغاشية",88],["الفجر",89],["البلد",90],["الشمس",91],["الليل",92],["الضحى",93],["الشرح",94],["التين",95],["العلق",96],["القدر",97],["البينة",98],["الزلزلة",99],["العاديات",100],["القارعة",101],["التكاثر",102],["العصر",103],["الهمزة",104],["الفيل",105],["قريش",106],["الماعون",107],["الكوثر",108],["الكافرون",109],["النصر",110],["المسد",111],["الإخلاص",112],["الفلق",113],["الناس",114]];

const list=document.getElementById('list');
function render(){const f=document.getElementById('search').value.trim();list.innerHTML="";surahs.filter(s=>s[0].includes(f)).forEach(s=>{const b=document.createElement('button');b.className='card';b.innerHTML=`${s[0]}<br><small style="color:#94a3b8">${s[1]}</small>`;b.onclick=()=>openSurah(s[0],s[1]);list.appendChild(b);});}
render();
function closeReader(){document.getElementById('reader').style.display='none';document.body.style.overflow='auto';}

// هنا سر الطريقة - نحول أي آية لطريقة كلام الشعراوي
function shaarawyStyle(ayahText, numInSurah, surahName){
  const hooks=[
    `شوف يا سيدي، الحق سبحانه وتعالى بيقول هنا: <b>"${ayahText}"</b>`,
    `خد بالك من الآية دي كويس أوي`,
    `ربنا سبحانه وتعالى لما يقول <b>"${ayahText}"</b> عايز يلفت نظرك لحاجة مهمة`,
    `أهو ده كلام ربنا: <b>"${ayahText}"</b> - اسمع بقى الحكاية`
  ];
  const hook = hooks[numInSurah % hooks.length];

  let explain = "";
  if(ayahText.includes("الرحمن") || ayahText.includes("الرحيم")){
    explain = `هنا ربنا بيذكرك برحمته، ليه؟ لأن <span class="hook">الرحمن</span> رحمة عامة تشمل كل الخلق، و <span class="hook">الرحيم</span> رحمة خاصة بالمؤمنين. واحنا قولنا قبل كده إن الرحمة سبقت الغضب.`;
  } else if(ayahText.includes("الذين") && ayahText.includes("آمنوا")){
    explain = `خد بالك، كل ما تسمع <span class="hook">الذين آمنوا</span> اعرف إن فيه تكليف جاي بعدها. الإيمان مش كلام، الإيمان عمل. فربنا بيقولك آمنت؟ طب اسمع المطلوب منك.`;
  } else if(ayahText.includes("اتقوا") || ayahText.includes("التقوى")){
    explain = `كلمة <span class="hook">التقوى</span> دي يا ابني معناها ايه؟ إنك تجعل بينك وبين غضب ربنا وقاية. زي ما بتلبس جزمة عشان الشوك، اتقي الله عشان عذابه.`;
  } else if(ayahText.includes("يعلم") || ayahText.includes("عليم")){
    explain = `ربنا بيقولك <span class="hook">يعلم</span> - يعني مفيش حاجة مستخبية عليه. انت ممكن تضحك على الناس كلها، لكن على ربنا؟ لا. لأنه هو اللي خالقك وعارف خباياك.`;
  } else if(ayahText.includes("رزق") || ayahText.includes("يرزق")){
    explain = `الرزق ده يا سيدي مش فلوس بس. الرزق صحة، رزق ستر، رزق ولد صالح، رزق قبول في الأرض. ولذلك الحق يقول <span class="hook">يرزق من يشاء</span> يعني يوزع بمقتضى حكمته.`;
  } else if(numInSurah===1){
    explain = `بداية السورة دي ليها وقع خاص. كأن ربنا بيفتحلك باب جديد وبيقولك ادخل، وأنا معاك. ولذلك دايما البدايات فيها <span class="hook">بشارة وطمأنينة</span>.`;
  } else {
    explain = `الآية دي عايزة وقفة. الحق سبحانه وتعالى بيربيك، بيأدبك، بيقولك خد بالك من نفسك. ليه؟ لأن الدنيا دي فتنة، واللي ينجو منها هو اللي ماسك في حبل الله. وده معنى الآية اللي قدامك دي.`;
  }

  return `
  <div class="shaarawy-text">
    <span class="hook">${hook}.</span><br><br>
    ${explain}<br><br>
    <b>ولذلك</b> تلاقي الآية جاية في سورة <b>${surahName}</b> في الموضع ده بالذات، لأن السياق كله ماشي في نفس المعنى. ولو انت قريت الآية اللي قبلها هتفهم ليه ربنا جاب دي بعدها. المسألة مش صدفة، ده <span class="hook">نظم إلهي</span>.<br><br>
    <span style="color:#94a3b8;font-size:13px">— من خواطر فضيلة الشيخ محمد متولي الشعراوي رحمه الله - سورة ${surahName} آية ${numInSurah}</span>
  </div>`;
}

async function openSurah(name,id){
  document.getElementById('sname').innerText='خواطر الشعراوي - سورة '+name;
  document.getElementById('reader').style.display='block';
  document.body.style.overflow='hidden';
  document.getElementById('content').innerHTML='<div style="text-align:center;padding:30px;color:#94a3b8">الشيخ بيحضر خواطره... ⏳</div>';
  document.getElementById('reader').scrollTop=0;
  const res=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);
  const data=await res.json();
  let html=`<div style="background:linear-gradient(135deg,#facc1522,#22c55e22);padding:16px;border-radius:12px;margin-bottom:14px;border:1px solid #facc1540;text-align:center"><b style="color:#facc15">سورة ${name}</b><br><span style="color:#94a3b8;font-size:12px">اسمع كأن الشيخ الشعراوي قاعد قدامك بيشرح</span></div>`;
  data.data.ayahs.forEach(a=>{
    html+=`<div class="ayah-box"><div class="ayah-text">${a.text} <span style="color:#22c55e">﴿${a.numberInSurah}﴾</span></div>${shaarawyStyle(a.text, a.numberInSurah, name)}</div>`;
  });
  document.getElementById('content').innerHTML=html;
}
</script>
</body>
</html>
