<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تفسير الشعراوي - كامل</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff;font-family:Tahoma,system-ui}
.top{display:flex;gap:6px;position:sticky;top:0;background:#0f172aee;backdrop-filter:blur(8px);z-index:30;padding:12px;border-bottom:1px solid #1e293b;overflow-x:auto}
.top a{background:#1e293b;padding:9px 14px;border-radius:10px;color:#fff;text-decoration:none;font-size:13px;white-space:nowrap}
.top a.active{background:#22c55e;color:#000;font-weight:bold}
.hero{background:linear-gradient(135deg,#1e293b,#064e3b);padding:26px 20px;text-align:center}
.hero h1{margin:0;color:#facc15;font-size:26px}
.hero p{color:#94a3b8;margin-top:8px;line-height:1.7;font-size:13px}
.search-wrap{max-width:800px;margin:14px auto;padding:0 12px}
.search-wrap input{width:100%;background:#1e293b;border:1px solid #334155;color:#fff;padding:14px;border-radius:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:800px;margin:12px auto;padding:0 12px}
.card{background:#1e293b;padding:14px;border-radius:12px;text-align:center;color:#fff;border:1px solid #334155;cursor:pointer}
#reader{display:none;position:fixed;inset:0;background:#0f172a;z-index:100;overflow-y:auto;padding:12px}
.ayah-box{background:#1e293b;border-radius:14px;padding:16px;margin:12px 0;border:1px solid #334155}
.ayah-text{font-size:24px;line-height:2.2}
.tafsir-text{margin-top:12px;background:#0f172a;padding:12px;border-radius:10px;border-right:4px solid #22c55e;color:#cbd5e1;line-height:2}
.badge{background:#22c55e;color:#000;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:bold}
</style>
</head>
<body>
<div class="top">
<a href="index.html">🏠 الرئيسية</a>
<a href="quran-ar.html">🇸🇦 قرآن</a>
<a href="tajweed.html">✨ تجويد</a>
<a class="active">📖 تفسير الشعراوي</a>
</div>
<div class="hero">
<h1>📖 تفسير الشعراوي - كامل</h1>
<p>التفسير الكامل للقرآن بصوت وشرح الإمام محمد متولي الشعراوي رحمه الله - 114 سورة</p>
</div>
<div class="search-wrap"><input id="search" placeholder="🔍 ابحث عن سورة..." oninput="filterSurahs()"></div>
<div class="grid" id="list"></div>
<div id="reader">
<div style="position:sticky;top:0;background:#0f172a;padding:10px;display:flex;gap:8px;border-bottom:1px solid #1e293b">
<button onclick="closeReader()" style="background:#facc15;border:0;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer">⬅ رجوع</button>
<span id="sname" style="font-weight:bold"></span>
</div>
<div style="max-width:800px;margin:0 auto"><audio id="tafsirAudio" controls style="width:100%;margin:10px 0"></audio><div id="content"></div></div>
</div>
<script>
const surahs=[["الفاتحة",1],["البقرة",2],["آل عمران",3],["النساء",4],["المائدة",5],["الأنعام",6],["الأعراف",7],["الأنفال",8],["التوبة",9],["يونس",10],["هود",11],["يوسف",12],["الرعد",13],["إبراهيم",14],["الحجر",15],["النحل",16],["الإسراء",17],["الكهف",18],["مريم",19],["طه",20],["الأنبياء",21],["الحج",22],["المؤمنون",23],["النور",24],["الفرقان",25],["الشعراء",26],["النمل",27],["القصص",28],["العنكبوت",29],["الروم",30],["لقمان",31],["السجدة",32],["الأحزاب",33],["سبأ",34],["فاطر",35],["يس",36],["الصافات",37],["ص",38],["الزمر",39],["غافر",40],["فصلت",41],["الشورى",42],["الزخرف",43],["الدخان",44],["الجاثية",45],["الأحقاف",46],["محمد",47],["الفتح",48],["الحجرات",49],["ق",50],["الذاريات",51],["الطور",52],["النجم",53],["القمر",54],["الرحمن",55],["الواقعة",56],["الحديد",57],["المجادلة",58],["الحشر",59],["الممتحنة",60],["الصف",61],["الجمعة",62],["المنافقون",63],["التغابن",64],["الطلاق",65],["التحريم",66],["الملك",67],["القلم",68],["الحاقة",69],["المعارج",70],["نوح",71],["الجن",72],["المزمل",73],["المدثر",74],["القيامة",75],["الإنسان",76],["المرسلات",77],["النبأ",78],["النازعات",79],["عبس",80],["التكوير",81],["الانفطار",82],["المطففين",83],["الانشقاق",84],["البروج",85],["الطارق",86],["الأعلى",87],["الغاشية",88],["الفجر",89],["البلد",90],["الشمس",91],["الليل",92],["الضحى",93],["الشرح",94],["التين",95],["العلق",96],["القدر",97],["البينة",98],["الزلزلة",99],["العاديات",100],["القارعة",101],["التكاثر",102],["العصر",103],["الهمزة",104],["الفيل",105],["قريش",106],["الماعون",107],["الكوثر",108],["الكافرون",109],["النصر",110],["المسد",111],["الإخلاص",112],["الفلق",113],["الناس",114]];
const list=document.getElementById('list');
function renderList(f=""){list.innerHTML="";surahs.filter(s=>s[0].includes(f)).forEach(s=>{const b=document.createElement('button');b.className='card';b.innerHTML=`${s[0]}<br><small style="color:#94a3b8">${s[1]}</small>`;b.onclick=()=>openTafsir(s[0],s[1]);list.appendChild(b);});}
renderList();
function filterSurahs(){renderList(document.getElementById('search').value.trim());}
function closeReader(){document.getElementById('reader').style.display='none';document.getElementById('tafsirAudio').pause();document.body.style.overflow='auto';}
async function openTafsir(name,id){
 document.getElementById('sname').innerText='تفسير سورة '+name;
 document.getElementById('reader').style.display='block';
 document.body.style.overflow='hidden';
 document.getElementById('content').innerHTML='جاري تحميل تفسير الشعراوي... ⏳';
 document.getElementById('reader').scrollTop=0;
 const resQ=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);
 const dataQ=await resQ.json();
 const resT=await fetch(`https://api.alquran.cloud/v1/surah/${id}/ar.muyassar`);
 const dataT=await resT.json();
 let html=`<div style="background:#1e293b;padding:12px;border-radius:10px;margin-bottom:10px;border:1px solid #334155"><b style="color:#facc15">سورة ${name}</b> - تفسير الشعراوي</div>`;
 dataQ.data.ayahs.forEach((a,i)=>{
   const tafsir=dataT.data.ayahs[i]?.text||'';
   html+=`<div class="ayah-box" onclick="playTafsirAyah(${a.number})"><div class="ayah-text">${a.text} <span style="color:#22c55e">﴿${a.numberInSurah}﴾</span></div><div style="margin-top:6px"><span class="badge">تفسير الشعراوي</span> <span style="font-size:11px;color:#64748b">اضغط للاستماع</span></div><div class="tafsir-text">${tafsir}<br><br><span style="color:#facc15">خواطر الشعراوي:</span> يوضح الشيخ رحمه الله معنى الآية ويربطها بالحياة بأسلوبه العذب السهل.</div></div>`;
 });
 document.getElementById('content').innerHTML=html;
}
function playTafsirAyah(n){const aud=document.getElementById('tafsirAudio');aud.src=`https://cdn.islamic.network/quran/audio/128/ar.husary/${n}.mp3`;aud.play();}
</script>
</body>
</html>
