<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم - تلاوة</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Tahoma;padding-bottom:160px}
.top{position:sticky;top:0;background:#0f172aee;backdrop-filter:blur(10px);padding:10px;border-bottom:1px solid #1e293b;z-index:10;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.top a,.top button,.top select{background:#1e293b;color:#fff;border:1px solid #334155;padding:8px 12px;border-radius:10px;font-size:13px;cursor:pointer;text-decoration:none}
.top select{max-width:180px}
.player{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;padding:12px;z-index:20}
.player audio{width:100%;margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.row b{color:#22c55e;font-size:14px}
.badge{background:#22c55e;color:#000;font-size:11px;padding:3px 8px;border-radius:20px;font-weight:bold}
.surah-list{max-width:800px;margin:10px auto;padding:0 10px}
.surah{display:flex;justify-content:space-between;align-items:center;background:#1e293b;border:1px solid #334155;padding:14px;border-radius:12px;margin:8px 0;cursor:pointer}
.surah.active{border-color:#22c55e;background:#14532d}
.surah.name{font-weight:bold}
.auto{display:flex;align-items:center;gap:6px;background:#0f172a;padding:6px 10px;border-radius:20px;border:1px solid #334155}
.auto input{accent-color:#22c55e}
.quran-text{max-width:800px;margin:10px auto;background:#fff;color:#000;padding:20px;border-radius:14px;line-height:2.2;font-size:22px;text-align:justify}
.quran-text.ayah{cursor:pointer;padding:2px 4px;border-radius:6px}
.quran-text.ayah.active{background:#fef08a}
.quran-text.ayah-num{color:#22c55e;font-size:14px}
</style>
</head>
<body>
<div class="top">
<a href="index.html">🏠 الرئيسية</a>
<select id="reciter">
<option value="afs">العجمي</option>
<option value="basit">عبدالباسط مرتل</option>
<option value="husary">الحصري</option>
<option value="minsh">المنشاوي</option>
<option value="hatem" selected>حاتم فريد الواعر - الأصلي</option>
<option value="ajm">أحمد العجمي</option>
</select>
<select id="surahSelect"></select>
<div class="auto"><input type="checkbox" id="autoNext" checked><label for="autoNext">تشغيل تلقائي ⏭️</label></div>
<button onclick="prevSurah()">⏮️ السابق</button>
<button onclick="nextSurah()">التالي ⏭️</button>
</div>

<div class="surah-list" id="surahList"></div>
<div class="quran-text" id="quranText">اختر سورة...</div>

<div class="player">
<div class="row"><b id="nowPlaying">لم يتم التشغيل</b><span class="badge" id="autoBadge">تلقائي: شغال</span></div>
<audio id="audio" controls controlsList="nodownload"></audio>
</div>

<script>
const surahs = ["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];

const recitersMap = {
afs: "https://server8.mp3quran.net/afs/",
basit: "https://server7.mp3quran.net/basit/",
husary: "https://server13.mp3quran.net/husr/",
minsh: "https://server10.mp3quran.net/minsh/",
hatem: "https://server11.mp3quran.net/hatem/",
ajm: "https://server8.mp3quran.net/ajm/"
};

let currentSurah = 1;
const audio = document.getElementById('audio');
const surahSelect = document.getElementById('surahSelect');
const reciterSelect = document.getElementById('reciter');
const autoNextCheck = document.getElementById('autoNext');
const autoBadge = document.getElementById('autoBadge');

surahs.forEach((name,i)=>{
  const opt=document.createElement('option');
  opt.value=i+1; opt.textContent=(i+1)+". "+name;
  surahSelect.appendChild(opt);
  const div=document.createElement('div');
  div.className='surah'; div.id='s-'+(i+1);
  div.innerHTML=`<span class="name">${i+1}. ${name}</span><span>▶️</span>`;
  div.onclick=()=>loadSurah(i+1);
  document.getElementById('surahList').appendChild(div);
});

function getAudioUrl(surahNum){
  const reciter = reciterSelect.value;
  const base = recitersMap[reciter];
  const num = String(surahNum).padStart(3,'0');
  return base + num + ".mp3";
}

async function loadSurah(num){
  currentSurah=num;
  surahSelect.value=num;
  document.querySelectorAll('.surah').forEach(el=>el.classList.remove('active'));
  document.getElementById('s-'+num)?.classList.add('active');
  document.getElementById('nowPlaying').textContent = surahs[num-1] + " - " + reciterSelect.options[reciterSelect.selectedIndex].text;

  // تحميل النص
  try{
    const res = await fetch(`https://api.quran.com/api/v4/quran/verses/uthmani?chapter_number=${num}`);
    const data = await res.json();
    let html="";
    data.verses.forEach((v,i)=>{
      html+=`<span class="ayah" id="a-${i+1}" onclick="playAyah(${i+1})">${v.text_uthmani} <span class="ayah-num">﴿${i+1}﴾</span> </span>`;
    });
    document.getElementById('quranText').innerHTML=html;
  }catch(e){ document.getElementById('quranText').innerHTML="جاري تحميل النص..."; }

  // تشغيل الصوت
  audio.src=getAudioUrl(num);
  audio.play();
  localStorage.setItem('lastSurah',num);
}

function playAyah(ayahNum){
  document.querySelectorAll('.ayah').forEach(a=>a.classList.remove('active'));
  document.getElementById('a-'+ayahNum)?.classList.add('active');
}

function nextSurah(){
  if(currentSurah<114) loadSurah(currentSurah+1);
}
function prevSurah(){
  if(currentSurah>1) loadSurah(currentSurah-1);
}

// لما السورة تخلص -> اللي بعدها تلقائيا
audio.addEventListener('ended',()=>{
  if(autoNextCheck.checked && currentSurah<114){
    setTimeout(()=>loadSurah(currentSurah+1), 1500);
  }
});

autoNextCheck.addEventListener('change',()=>{
  autoBadge.textContent = autoNextCheck.checked? "تلقائي: شغال" : "تلقائي: متوقف";
  autoBadge.style.background = autoNextCheck.checked? "#22c55e" : "#64748b";
});

reciterSelect.addEventListener('change',()=>loadSurah(currentSurah));
surahSelect.addEventListener('change',()=>loadSurah(parseInt(surahSelect.value)));

// تظليل الآية مع الصوت (تقديري)
let timer=null;
audio.addEventListener('timeupdate',()=>{
  if(!audio.duration) return;
  const totalAyahs = document.querySelectorAll('.ayah').length;
  if(totalAyahs==0) return;
  const progress = audio.currentTime / audio.duration;
  const currentAyah = Math.floor(progress * totalAyahs) + 1;
  document.querySelectorAll('.ayah').forEach(a=>a.classList.remove('active'));
  document.getElementById('a-'+currentAyah)?.classList.add('active');
  document.getElementById('a-'+currentAyah)?.scrollIntoView({behavior:'smooth',block:'center'});
});

// تحميل آخر سورة
const last = localStorage.getItem('lastSurah');
loadSurah(last? parseInt(last) : 1);
</script>
</body>
</html>
