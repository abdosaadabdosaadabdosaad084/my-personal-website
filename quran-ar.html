<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم - آية بآية</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1222;color:#fff;font-family:'Tajawal',system-ui;min-height:100vh}
.top{position:sticky;top:0;z-index:20;background:#0f172aee;backdrop-filter:blur(12px);padding:12px;border-bottom:1px solid #1e293b;display:flex;flex-direction:column;gap:10px}
.sel{background:#1e293b;border:1px solid #334155;padding:10px 14px;border-radius:14px;display:flex;gap:8px;align-items:center;width:95%;max-width:500px;margin:0 auto}
.sel select{background:transparent;color:#fff;border:0;width:100%;font-size:15px;outline:none}
.sel select option{background:#1e293b}
#reader{display:flex;flex-direction:column;min-height:calc(100vh - 140px);padding:12px}
.reader-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;background:#1e293b;border:1px solid #334155;padding:10px 12px;border-radius:12px;margin-bottom:12px}
.ayah-box{background:#1e293b;border:2px solid #facc15;border-radius:24px;padding:28px 20px;max-width:850px;width:100%;min-height:200px;display:flex;flex-direction:column;justify-content:center;align-items:center;cursor:pointer;box-shadow:0 0 0 1px #facc1520, 0 20px 50px -20px #facc1540}
.words-line{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;line-height:2.9;font-family:'Amiri Quran', serif;text-align:center}
.word{padding:2px 6px;border-radius:8px;transition:all 0.25s ease;color:#cbd5e1}
.word.active-word{color:#facc15;background:linear-gradient(180deg,#facc1530,transparent);text-shadow:0 0 18px #facc15;transform:scale(1.18);font-weight:bold}
.ayah-num{color:#22c55e;margin-top:16px;font-size:15px}
.nav{display:flex;gap:12px;justify-content:center;margin:18px 0}
.nav button{background:#1e293b;border:1px solid #334155;color:#fff;padding:14px 26px;border-radius:14px;cursor:pointer;font-weight:bold;min-width:110px}
.surah-ctrl{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.surah-ctrl button{background:#1e293b;border:1px solid #334155;color:#fff;padding:10px 18px;border-radius:12px;cursor:pointer}
.status{color:#94a3b8;font-size:12px;text-align:center;margin:6px 0}
</style>
</head>
<body>
<div class="top">
<div class="sel"><span>📖</span><select id="surahSelect"></select></div>
<div class="sel"><span>🎙️</span><select id="qariSelect">
<option value="ar.alafasy">مشاري العفاسي</option>
<option value="ar.husary">الحصري</option>
<option value="ar.minshawi">المنشاوي</option>
<option value="ar.abdulbasitmurattal">عبدالباسط</option>
<option value="ar.mahermuaiqly">ماهر المعيقلي</option>
<option value="ar.shaatree">الشاطري</option>
<option value="ar.tablawi">الطبلاوي (سورة كاملة)</option>
<option value="ar.hatemfarid">حاتم فريد (سورة كاملة)</option>
</select></div>
</div>
<div id="reader">
<div class="reader-bar">
<div><span id="sname" style="font-weight:bold">اختر سورة</span> <span id="counter" style="color:#94a3b8;font-size:12px"></span></div>
<div style="display:flex;gap:6px">
<button onclick="downloadSurah()" style="background:#22c55e;color:#000;border:0;padding:9px 14px;border-radius:10px;font-weight:bold">📥 السورة</button>
<button onclick="downloadAyah()" style="background:#facc15;color:#000;border:0;padding:9px 14px;border-radius:10px;font-weight:bold">📥 الآية</button>
</div>
</div>
<audio id="audioVisible" controls style="width:100%;border-radius:12px"></audio>
<div class="status" id="status">اضغط على الآية للإيقاف / التشغيل</div>
<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:20px 10px">
<div class="ayah-box" id="ayahBox" onclick="togglePlay()">
<div class="words-line" id="words"></div>
<div class="ayah-num" id="ayahNum"></div>
</div>
</div>
<div class="nav">
<button onclick="prevAyah()">⬅ السابقة</button>
<button onclick="nextAyah()">التالية ➡</button>
</div>
<div class="surah-ctrl">
<button onclick="prevSurah()">⏮ السورة السابقة</button>
<button onclick="nextSurah()">السورة التالية ⏭</button>
</div>
</div>
<script>
const surahs=[["الفاتحة",1],["البقرة",2],["آل عمران",3],["النساء",4],["المائدة",5],["الأنعام",6],["الأعراف",7],["الأنفال",8],["التوبة",9],["يونس",10],["هود",11],["يوسف",12],["الرعد",13],["إبراهيم",14],["الحجر",15],["النحل",16],["الإسراء",17],["الكهف",18],["مريم",19],["طه",20],["الأنبياء",21],["الحج",22],["المؤمنون",23],["النور",24],["الفرقان",25],["الشعراء",26],["النمل",27],["القصص",28],["العنكبوت",29],["الروم",30],["لقمان",31],["السجدة",32],["الأحزاب",33],["سبأ",34],["فاطر",35],["يس",36],["الصافات",37],["ص",38],["الزمر",39],["غافر",40],["فصلت",41],["الشورى",42],["الزخرف",43],["الدخان",44],["الجاثية",45],["الأحقاف",46],["محمد",47],["الفتح",48],["الحجرات",49],["ق",50],["الذاريات",51],["الطور",52],["النجم",53],["القمر",54],["الرحمن",55],["الواقعة",56],["الحديد",57],["المجادلة",58],["الحشر",59],["الممتحنة",60],["الصف",61],["الجمعة",62],["المنافقون",63],["التغابن",64],["الطلاق",65],["التحريم",66],["الملك",67],["القلم",68],["الحاقة",69],["المعارج",70],["نوح",71],["الجن",72],["المزمل",73],["المدثر",74],["القيامة",75],["الإنسان",76],["المرسلات",77],["النبأ",78],["النازعات",79],["عبس",80],["التكوير",81],["الانفطار",82],["المطففين",83],["الانشقاق",84],["البروج",85],["الطارق",86],["الأعلى",87],["الغاشية",88],["الفجر",89],["البلد",90],["الشمس",91],["الليل",92],["الضحى",93],["الشرح",94],["التين",95],["العلق",96],["القدر",97],["البينة",98],["الزلزلة",99],["العاديات",100],["القارعة",101],["التكاثر",102],["العصر",103],["الهمزة",104],["الفيل",105],["قريش",106],["الماعون",107],["الكوثر",108],["الكافرون",109],["النصر",110],["المسد",111],["الإخلاص",112],["الفلق",113],["الناس",114]];
let ayahsData=[], currentIdx=0, qariNow="ar.alafasy", currentSurahId=1, isFullSurah=false, isPlaying=false, wordTimer=null;
const surahSelect=document.getElementById('surahSelect'), qariSelect=document.getElementById('qariSelect'), audio=document.getElementById('audioVisible'), wordsEl=document.getElementById('words'), ayahNumEl=document.getElementById('ayahNum'), counterEl=document.getElementById('counter'), snameEl=document.getElementById('sname'), statusEl=document.getElementById('status'), ayahBox=document.getElementById('ayahBox');
surahs.forEach(s=>{const o=document.createElement('option');o.value=s[1];o.textContent=s[0];surahSelect.appendChild(o);});
function initQari(){qariNow=qariSelect.value;isFullSurah=(qariNow==='ar.tablawi'||qariNow==='ar.hatemfarid');localStorage.setItem('qariNow',qariNow);if(ayahsData.length)loadAyah(currentIdx);}
qariSelect.onchange=initQari;surahSelect.onchange=()=>openSurah(parseInt(surahSelect.value));
let savedQari=localStorage.getItem('qariNow');if(savedQari){qariSelect.value=savedQari;qariNow=savedQari;isFullSurah=(qariNow==='ar.tablawi'||qariNow==='ar.hatemfarid');}
async function openSurah(id){currentSurahId=id;surahSelect.value=id;const name=surahs.find(s=>s[1]==id)[0];snameEl.textContent=name;statusEl.textContent='جاري التحميل...';try{const res=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);const data=await res.json();ayahsData=data.data.ayahs;currentIdx=0;if(isFullSurah){let server=qariNow==='ar.tablawi'?'https://server12.mp3quran.net/tblawi/':'https://server11.mp3quran.net/hatem/';audio.src=server+String(id).padStart(3,'0')+'.mp3';}loadAyah(0);}catch(e){statusEl.textContent='فشل التحميل';}}
function loadAyah(idx){if(idx<0||idx>=ayahsData.length)return;currentIdx=idx;clearInterval(wordTimer);const ayah=ayahsData[idx];let txt=ayah.text.trim();if(idx===0&&currentSurahId!==1&&currentSurahId!==9){txt=txt.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/,'');}const words=txt.split(' ').filter(Boolean);wordsEl.innerHTML=words.map(w=>`<span class="word">${w}</span>`).join(' ');ayahNumEl.textContent=`﴿ ${ayah.numberInSurah} ﴾`;counterEl.textContent=`${idx+1} / ${ayahsData.length}`;if(isFullSurah){highlightWords(600);}else{audio.src=`https://cdn.islamic.network/quran/audio/128/${qariNow}/${ayah.number}.mp3`;audio.onloadedmetadata=()=>{if(isPlaying)highlightWords(null,audio.duration);};audio.onended=()=>{if(currentIdx<ayahsData.length-1)nextAyah(true);};if(isPlaying)audio.play().catch(()=>{});}}
function highlightWords(fixedPer,duration){const els=Array.from(wordsEl.querySelectorAll('.word'));if(!els.length)return;clearInterval(wordTimer);els.forEach(w=>w.classList.remove('active-word'));let per=fixedPer||((duration||els.length*0.6)*1000/els.length);if(per<280)per=280;if(per>950)per=950;let i=0;wordTimer=setInterval(()=>{els.forEach(w=>w.classList.remove('active-word'));if(i<els.length){els[i].classList.add('active-word');i++;}else clearInterval(wordTimer);},per);}
function togglePlay(){if(!ayahsData.length)return;if(audio.paused){audio.play().catch(()=>{});isPlaying=true;const els=Array.from(wordsEl.querySelectorAll('.word'));let start=els.findIndex(e=>e.classList.contains('active-word'));if(start<0){start=0;highlightWords(null,audio.duration);}statusEl.textContent='يتم التشغيل...';}else{audio.pause();isPlaying=false;clearInterval(wordTimer);statusEl.textContent='متوقف - اضغط للتشغيل';}}
function nextAyah(auto=false){if(!auto)isPlaying=true;if(currentIdx<ayahsData.length-1){currentIdx++;loadAyah(currentIdx);if(isPlaying&&!isFullSurah)setTimeout(()=>audio.play().catch(()=>{}),100);}else nextSurah();}
function prevAyah(){isPlaying=true;if(currentIdx>0){currentIdx--;loadAyah(currentIdx);if(!isFullSurah)audio.play().catch(()=>{});}}
function prevSurah(){if(currentSurahId>1)openSurah(currentSurahId-1);}
function nextSurah(){if(currentSurahId<114)openSurah(currentSurahId+1);}
function downloadSurah(){let url;if(isFullSurah){let server=qariNow==='ar.tablawi'?'https://server12.mp3quran.net/tblawi/':'https://server11.mp3quran.net/hatem/';url=server+String(currentSurahId).padStart(3,'0')+'.mp3';}else url=`https://cdn.islamic.network/quran/audio-surah/128/${qariNow}/${currentSurahId}.mp3`;window.open(url,'_blank');}
function downloadAyah(){if(!ayahsData.length)return;if(isFullSurah){statusEl.textContent='غير متاح في وضع السورة الكاملة - اختر قارئ آخر';return;}const num=ayahsData[currentIdx].number;window.open(`https://cdn.islamic.network/quran/audio/128/${qariNow}/${num}.mp3`,'_blank');}
let last=localStorage.getItem('lastSurah');if(last)currentSurahId=parseInt(last);openSurah(currentSurahId);
</script>
</body>
</html>
