<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن</title>
<style>
body{background:#0f172a;color:#fff;font-family:Tahoma;margin:0;padding:10px}
.top{display:flex;gap:6px;position:sticky;top:0;background:#0f172a;z-index:30;padding:10px 0}
.top a{background:#1e293b;padding:9px 12px;border-radius:10px;color:#fff;text-decoration:none;font-size:13px}
.top a.active{background:#22c55e;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#1e293b;padding:14px;border-radius:12px;text-align:center;border:0;width:100%;color:#fff}
#reader{display:none;position:fixed;inset:0;background:#0f172a;z-index:100;overflow-y:auto;padding:12px}
.qari-bar{background:#1e293b;padding:10px;border-radius:10px;margin:10px 0;display:flex;gap:8px;align-items:center;position:sticky;top:5px;z-index:20}
select{background:#0f172a;color:#fff;border:1px solid #334155;padding:8px;border-radius:8px;width:100%}
.basmala-out{text-align:center;font-size:26px;color:#facc15;padding:14px;background:#1e293b;border-radius:14px;margin:12px 0;border:1px solid #facc1530}
.ayah{padding:16px;background:#1e293b;margin-bottom:8px;border-radius:10px;font-size:24px;line-height:2.7;position:relative}
.ayah.active{border:2px solid #facc15}
.word{padding:3px 5px;border-radius:7px;display:inline-block;transition:.25s}
.word.active-word{background:#facc15;color:#000;font-weight:bold;transform:scale(1.15)}
audio{width:100%;margin:8px 0}
.dl-ayah{position:absolute;top:6px;right:6px;background:#0f172a;border:1px solid #334155;color:#facc15;border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer}
.dl-surah{background:#22c55e;color:#000;border:0;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:8px}
.header-row{display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="top"><a href="index.html">🏠 الرئيسية</a><a class="active">🇸🇦 قرآن</a><a href="tafsir.html">📖 تفسير</a></div>
<div class="grid" id="list"></div>
<div id="reader">
<div class="header-row">
<div style="display:flex;align-items:center">
<button onclick="closeReader()" style="background:#facc15;border:0;padding:10px 18px;border-radius:8px;font-weight:bold">⬅ رجوع</button>
<span id="sname" style="font-weight:bold;margin-right:10px"></span>
<button class="dl-surah" onclick="downloadSurah()">📥 تحميل السورة</button>
</div>
</div>
<div class="qari-bar"><label>🎙️</label>
<select id="qari" onchange="restartCurrent()">
<option value="ar.alafasy">مشاري العفاسي</option>
<option value="ar.husary">الحصري</option>
<option value="ar.minshawi">المنشاوي</option>
<option value="ar.mahermuaiqly">المعيقلي</option>
<option value="ar.shaatree">الشاطري</option>
</select></div>
<audio id="audio" controls></audio>
<div id="content"></div>
</div>
<script>
const surahs=[["الفاتحة",1],["البقرة",2],["آل عمران",3],["النساء",4],["المائدة",5],["الأنعام",6],["الأعراف",7],["الأنفال",8],["التوبة",9],["يونس",10],["هود",11],["يوسف",12],["الرعد",13],["إبراهيم",14],["الحجر",15],["النحل",16],["الإسراء",17],["الكهف",18],["مريم",19],["طه",20],["الأنبياء",21],["الحج",22],["المؤمنون",23],["النور",24],["الفرقان",25],["الشعراء",26],["النمل",27],["القصص",28],["العنكبوت",29],["الروم",30],["لقمان",31],["السجدة",32],["الأحزاب",33],["سبأ",34],["فاطر",35],["يس",36],["الصافات",37],["ص",38],["الزمر",39],["غافر",40],["فصلت",41],["الشورى",42],["الزخرف",43],["الدخان",44],["الجاثية",45],["الأحقاف",46],["محمد",47],["الفتح",48],["الحجرات",49],["ق",50],["الذاريات",51],["الطور",52],["النجم",53],["القمر",54],["الرحمن",55],["الواقعة",56],["الحديد",57],["المجادلة",58],["الحشر",59],["الممتحنة",60],["الصف",61],["الجمعة",62],["المنافقون",63],["التغابن",64],["الطلاق",65],["التحريم",66],["الملك",67],["القلم",68],["الحاقة",69],["المعارج",70],["نوح",71],["الجن",72],["المزمل",73],["المدثر",74],["القيامة",75],["الإنسان",76],["المرسلات",77],["النبأ",78],["النازعات",79],["عبس",80],["التكوير",81],["الانفطار",82],["المطففين",83],["الانشقاق",84],["البروج",85],["الطارق",86],["الأعلى",87],["الغاشية",88],["الفجر",89],["البلد",90],["الشمس",91],["الليل",92],["الضحى",93],["الشرح",94],["التين",95],["العلق",96],["القدر",97],["البينة",98],["الزلزلة",99],["العاديات",100],["القارعة",101],["التكاثر",102],["العصر",103],["الهمزة",104],["الفيل",105],["قريش",106],["الماعون",107],["الكوثر",108],["الكافرون",109],["النصر",110],["المسد",111],["الإخلاص",112],["الفلق",113],["الناس",114]];
let ayahsData=[],currentIdx=0,wordTimer=null,qariNow="ar.alafasy",currentSurahId=1,currentSurahName="";
const list=document.getElementById('list');
surahs.forEach(s=>{const b=document.createElement('button');b.className='card';b.innerHTML=`${s[0]}<br><small style="color:#94a3b8">${s[1]}</small>`;b.onclick=()=>openSurah(s[0],s[1]);list.appendChild(b);});
function closeReader(){document.getElementById('reader').style.display='none';document.getElementById('audio').pause();clearInterval(wordTimer);document.body.style.overflow='auto';}
function restartCurrent(){qariNow=document.getElementById('qari').value;playAyahByIndex(currentIdx);}
function downloadSurah(){
 const url=`https://cdn.islamic.network/quran/audio-surah/128/${qariNow}/${currentSurahId}.mp3`;
 const a=document.createElement('a');a.href=url;a.download=`${currentSurahName}-${qariNow}.mp3`;a.click();
}
function downloadAyah(globalNum, numInSurah){
 const url=`https://cdn.islamic.network/quran/audio/128/${qariNow}/${globalNum}.mp3`;
 const a=document.createElement('a');a.href=url;a.download=`${currentSurahName}-${numInSurah}.mp3`;a.click();
}
async function openSurah(name,id){
 currentSurahId=id;currentSurahName=name;
 document.getElementById('sname').innerText=name;
 document.getElementById('reader').style.display='block';
 document.body.style.overflow='hidden';
 document.getElementById('content').innerHTML='جاري التحميل...';
 document.getElementById('reader').scrollTop=0;
 const res=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);
 const data=await res.json();ayahsData=data.data.ayahs;
 let html='';
 if(id!==1 && id!==9){ html+=`<div class="basmala-out">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`; }
 data.data.ayahs.forEach((a,i)=>{
   let txt=a.text.trim();
   if(i===0 && id!==1 && id!==9){
     txt=txt.replace(/^[^ ]+ [^ ]+ [^ ]+ [^ ]+\s*/,'').replace(/بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ/,'').replace(/بسم الله الرحمن الرحيم/,'').trim();
     if(txt.startsWith('بِسْمِ')){ const p=txt.split(' '); if(p.length>4) txt=p.slice(4).join(' '); }
   }
   if(!txt) return;
   const words=txt.split(' ').filter(w=>w).map(w=>`<span class="word">${w}</span>`).join(' ');
   html+=`<div class="ayah" id="ayah-${i}"><button class="dl-ayah" onclick="downloadAyah(${a.number},${a.numberInSurah})">⬇️ ${a.numberInSurah}</button>${words} <span style="color:#22c55e">﴿${a.numberInSurah}﴾</span></div>`;
 });
 document.getElementById('content').innerHTML=html;
 playAyahByIndex(0);
}
const WAQF_MARKS = ['ۘ','ۗ','ۚ','ۙ','ۖ','ۛ','ۜ','۝','۞','۟','۠','ۡ','ۢ','ۣ','ۤ','ۥ','ۦ','ۧ','ۨ','۩','ؗ','ؘ','ؙ','ؚ','صلى','قلى','صه','قل','ج','لا','صل','قلي','ص','مـ','ه','ـ','ۓ'];
function isWaqfMark(txt){
  let w = txt.trim().replace(/[﴿﴾۝٠-٩0-9]/g,'').trim();
  if(!w) return true;
  if(WAQF_MARKS.includes(w)) return true;
  if(/^[\u06D6-\u06ED\u08D4-\u08E1]+$/.test(w)) return true;
  if(w.length <= 3 && /^[صقلجمهلا]+[ىي]?$/.test(w)) return true;
  return false;
}
function playAyahByIndex(idx){
 if(idx>=ayahsData.length) return;currentIdx=idx;
 document.querySelectorAll('.ayah').forEach(el=>el.classList.remove('active'));
 const el=document.getElementById(`ayah-${idx}`);if(!el){playAyahByIndex(idx+1);return;}
 el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'center'});
 const audio=document.getElementById('audio');
 audio.src=`https://cdn.islamic.network/quran/audio/128/${qariNow}/${ayahsData[idx].number}.mp3`;
 audio.play().catch(()=>{});
 audio.onloadedmetadata=()=>{
   const allWords=Array.from(el.querySelectorAll('.word'));
   if(allWords.length===0) return;
   const highlightWords = allWords.filter(span =>!isWaqfMark(span.innerText));
   if(highlightWords.length===0) return;
   const dur=audio.duration||highlightWords.length*0.65;
   const per=(dur*1000)/highlightWords.length;
   clearInterval(wordTimer);
   let w=0;
   allWords.forEach(x=>x.classList.remove('active-word'));
   wordTimer=setInterval(()=>{
     allWords.forEach(x=>x.classList.remove('active-word'));
     if(w<highlightWords.length){
       highlightWords[w].classList.add('active-word');
       w++;
     }else{
       clearInterval(wordTimer);
     }
   },per);
 };
 audio.onended=()=>{playAyahByIndex(idx+1);};
}
</script>
</body>
</html>
