<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1222;color:#fff;font-family:'Tajawal';height:100vh;display:flex;flex-direction:column}
.top{background:#0f172a;padding:8px;display:flex;gap:8px;border-bottom:1px solid #1e293b}
.sel{flex:1;background:#1e293b;border:1px solid #334155;padding:8px 10px;border-radius:10px;display:flex;gap:6px}
.sel select{flex:1;background:transparent;color:#fff;border:0;font-size:14px;font-weight:bold;outline:none}
.sel option{background:#1e293b}
.bar{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#0f172a}
.fontCtrl{display:flex;gap:4px;align-items:center;background:#1e293b;border:1px solid #334155;padding:2px 6px;border-radius:8px}
.fontCtrl button{background:#334155;color:#facc15;border:0;width:28px;height:28px;border-radius:6px;font-weight:bold}
audio{width:96%;margin:6px auto;display:block;height:36px}
.ayahWrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:8px;overflow:auto}
.ayah-box{background:#1e293b;border:2px solid #334155;border-radius:14px;padding:14px;width:100%;max-width:760px;transition:0.3s}
.ayah-box.reading{border-color:#facc15;box-shadow:0 0 15px #facc1540;border-bottom:4px solid #000}
.ayah-box.reading.words-line{border-bottom:3px solid #000;padding-bottom:8px}
.words-line{font-family:'Amiri Quran';font-size:20px;line-height:2.4;text-align:center;direction:rtl}
.word{display:inline-block;margin:2px 6px;padding:2px 8px;border-radius:8px;border:1.5px solid transparent;transition:0.2s}
.word.active-word{color:#facc15;background:#facc1530;border-color:#facc15}
.waqf{display:inline-block;color:#5a6a85;margin:0 2px}
.ayahNum{color:#22c55e;text-align:center;margin-top:10px;font-size:14px}
.nav{display:flex;gap:10px;justify-content:center;padding:8px}
.nav button{background:#1e293b;border:1px solid #334155;color:#fff;padding:8px 18px;border-radius:10px;font-weight:bold}
.status{text-align:center;color:#facc15;font-size:12px;font-weight:bold;min-height:16px}
</style>
</head>
<body>
<div class="top">
<div class="sel">📖 <select id="surahSelect"></select></div>
<div class="sel">🎙️ <select id="qariSelect">
<option value="ar.alafasy">العفاسي</option>
<option value="ar.husary">الحصري</option>
<option value="ar.minshawi">المنشاوي</option>
<option value="ar.mahermuaiqly">المعيقلي</option>
<option value="ar.tablawi">الطبلاوي</option>
<option value="ar.hatemfarid">حاتم فريد</option>
</select></div>
</div>
<div class="bar"><div id="sname"></div><div class="fontCtrl"><button onclick="changeFont(-2)">-</button><span id="fSize">20</span><button onclick="changeFont(2)">+</button></div></div>
<audio id="audio" controls autoplay></audio>
<div class="status" id="status"></div>
<div class="ayahWrap"><div class="ayah-box" id="ayahBox"><div class="words-line" id="words"></div><div class="ayahNum" id="aNum"></div></div></div>
<div class="nav"><button onclick="prev()">⬅ السابقة</button><button onclick="next()">التالية ➡</button></div>
<script>
const WAQF=new Set(["ج","ۚ","ۖ","ۗ","ۘ","ۙ","ۛ","ۜ","۝","۞","۩","صه","قلى","صلى","لا","م","ۓ"]);
const surahs=[["الفاتحة",1],["البقرة",2],["آل عمران",3],["النساء",4],["المائدة",5],["الأنعام",6],["الأعراف",7],["الأنفال",8],["التوبة",9],["يونس",10],["هود",11],["يوسف",12],["الرعد",13],["إبراهيم",14],["الحجر",15],["النحل",16],["الإسراء",17],["الكهف",18],["مريم",19],["طه",20],["الأنبياء",21],["الحج",22],["المؤمنون",23],["النور",24],["الفرقان",25],["الشعراء",26],["النمل",27],["القصص",28],["العنكبوت",29],["الروم",30],["لقمان",31],["السجدة",32],["الأحزاب",33],["سبأ",34],["فاطر",35],["يس",36],["الصافات",37],["ص",38],["الزمر",39],["غافر",40],["فصلت",41],["الشورى",42],["الزخرف",43],["الدخان",44],["الجاثية",45],["الأحقاف",46],["محمد",47],["الفتح",48],["الحجرات",49],["ق",50],["الذاريات",51],["الطور",52],["النجم",53],["القمر",54],["الرحمن",55],["الواقعة",56],["الحديد",57],["المعارج",70],["نوح",71],["الجن",72],["المزمل",73],["المدثر",74],["القيامة",75],["الإنسان",76],["المرسلات",77],["النبأ",78],["النازعات",79],["عبس",80],["التكوير",81],["الانفطار",82],["المطففين",83],["الانشقاق",84],["البروج",85],["الطارق",86],["الأعلى",87],["الغاشية",88],["الفجر",89],["البلد",90],["الشمس",91],["الليل",92],["الضحى",93],["الشرح",94],["التين",95],["العلق",96],["القدر",97],["البينة",98],["الزلزلة",99],["العاديات",100],["القارعة",101],["التكاثر",102],["العصر",103],["الهمزة",104],["الفيل",105],["قريش",106],["الماعون",107],["الكوثر",108],["الكافرون",109],["النصر",110],["المسد",111],["الإخلاص",112],["الفلق",113],["الناس",114]];

let seq=[],cur=0,qari="ar.alafasy",surahId=11,isFull=false,fontSize=20,wordTimer=null,autoTimer=null;
const surahSel=document.getElementById('surahSelect'),qariSel=document.getElementById('qariSelect'),audio=document.getElementById('audio'),wordsEl=document.getElementById('words'),aNumEl=document.getElementById('aNum'),snameEl=document.getElementById('sname'),statusEl=document.getElementById('status'),fSizeEl=document.getElementById('fSize'),ayahBox=document.getElementById('ayahBox');
surahs.forEach(s=>{let o=document.createElement('option');o.value=s[1];o.textContent=s[0];surahSel.appendChild(o);});

function cleanBasmala(txt,sid,isFirst){
 if(sid===1) return txt; // الفاتحة نسيب البسملة
 if(sid===9) return txt; // التوبة مفيهاش بسملة أصلا
 if(isFirst){
   return txt.replace(/بِسْمِ\s*ٱللَّهِ\s*ٱلرَّحْمَٰنِ\s*ٱلرَّحِيمِ/g,'').replace(/بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ/g,'').replace(/بسم الله الرحمن الرحيم/g,'').replace(/بِّسْمِ/g,'').trim();
 }
 return txt;
}
function changeFont(d){fontSize+=d;if(fontSize<14)fontSize=14;if(fontSize>34)fontSize=34;fSizeEl.textContent=fontSize;wordsEl.style.fontSize=fontSize+'px';localStorage.setItem('fs',fontSize);}
let fs=localStorage.getItem('fs');if(fs){fontSize=parseInt(fs);fSizeEl.textContent=fontSize;}wordsEl.style.fontSize=fontSize+'px';
let qSaved=localStorage.getItem('qari');if(qSaved){qariSel.value=qSaved;qari=qSaved;}isFull=(qari==='ar.tablawi'||qari==='ar.hatemfarid');
qariSel.onchange=()=>{qari=qariSel.value;localStorage.setItem('qari',qari);isFull=(qari==='ar.tablawi'||qari==='ar.hatemfarid');openSurah(surahId);};
surahSel.onchange=()=>openSurah(parseInt(surahSel.value));

async function openSurah(id){
 surahId=id;surahSel.value=id;snameEl.textContent=surahs.find(s=>s[1]==id)[0];localStorage.setItem('lastS',id);
 clearInterval(wordTimer);clearTimeout(autoTimer);audio.pause();
 const res=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);const data=await res.json();
 seq=[];
 data.data.ayahs.forEach((a,idx)=>{
  let txt=cleanBasmala(a.text.trim(),id,idx===0);
  if(!txt) return;
  seq.push({text:txt,tokens:txt.split(' ').filter(Boolean),num:a.number,numIn:a.numberInSurah});
 });
 cur=0;
 load(0,true);
}
function render(tokens){
 let html='';
 tokens.forEach(t=>{
  if(WAQF.has(t)) html+=`<span class="waqf">${t}</span> `;
  else html+=`<span class="word">${t}</span> `;
 });
 return html;
}
function load(idx,autoplay){
 if(idx<0||idx>=seq.length) return;
 clearInterval(wordTimer);clearTimeout(autoTimer);
 cur=idx;const it=seq[idx];
 ayahBox.classList.add('reading');
 wordsEl.innerHTML=render(it.tokens);
 aNumEl.textContent=`﴿ ${it.numIn} ﴾`;
 statusEl.textContent=`يقرأ الآن: ${surahs.find(s=>s[1]==surahId)[0]} - آية ${it.numIn}`;
 if(isFull){
  let base=qari==='ar.tablawi'?'https://server12.mp3quran.net/tblawi/':'https://server11.mp3quran.net/hatem/';
  audio.src=base+String(surahId).padStart(3,'0')+'.mp3';
  // للسور الكاملة: نحسب مكان الآية تقريبيا ونمشي تلقائي
  audio.onloadedmetadata=()=>{
    if(autoplay) audio.play().catch(()=>{});
    // قسّم وقت السورة على عدد الآيات
    let perAyah = audio.duration / seq.length;
    let seek = perAyah * idx;
    if(Math.abs(audio.currentTime - seek) > 2) audio.currentTime = seek;
  };
  audio.ontimeupdate=()=>{
    if(!audio.duration) return;
    let perAyah = audio.duration / seq.length;
    let currentIdx = Math.floor(audio.currentTime / perAyah);
    if(currentIdx!==cur && currentIdx<seq.length){
      load(currentIdx,false);
    }
  };
 }else{
  audio.src=`https://cdn.islamic.network/quran/audio/128/${qari}/${it.num}.mp3`;
  audio.onloadedmetadata=()=>{if(autoplay) audio.play().catch(()=>{});};
  audio.onplay=()=>highlight();
  audio.onended=()=>{
    statusEl.textContent=`انتهت آية ${it.numIn} - ينتقل للآية التالية تلقائيا`;
    if(idx < seq.length-1){
      autoTimer=setTimeout(()=>load(idx+1,true),600);
    }else{
      if(surahId<114) openSurah(surahId+1);
    }
  };
  audio.ontimeupdate=null;
 }
}
function highlight(){
 clearInterval(wordTimer);
 const els=[...wordsEl.querySelectorAll('.word')];
 els.forEach(e=>e.classList.remove('active-word'));
 if(!els.length||!audio.duration||isFull) return;
 let d=audio.duration;
 let per=(d*1000)/els.length; if(per<280)per=280; if(per>900)per=900;
 let i=0;
 wordTimer=setInterval(()=>{els.forEach(e=>e.classList.remove('active-word'));if(i<els.length){els[i].classList.add('active-word');i++;}else clearInterval(wordTimer);},per);
}
function next(){load(cur+1,true);}
function prev(){load(cur-1,true);}
let last=localStorage.getItem('lastS');if(last) surahId=parseInt(last);
openSurah(surahId);
</script>
</body>
</html>
