<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم - تلاوة</title>
<style>
*{box-sizing:border-box}
body{background:#0f172a;color:#fff;font-family:Tahoma,system-ui;margin:0;padding:10px}
.top{display:flex;gap:6px;position:sticky;top:0;background:#0f172aee;backdrop-filter:blur(8px);z-index:30;padding:10px 0;overflow-x:auto;border-bottom:1px solid #1e293b}
.top a{background:#1e293b;padding:9px 14px;border-radius:10px;color:#fff;text-decoration:none;font-size:13px;white-space:nowrap}
.top a.active{background:#22c55e;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.card{background:#1e293b;padding:14px;border-radius:12px;text-align:center;color:#fff;border:1px solid #334155;cursor:pointer}
#reader{display:none;position:fixed;inset:0;background:#0f172a;z-index:100;overflow-y:auto;padding:12px}
.qari-bar{background:#1e293b;padding:12px;border-radius:12px;margin:10px 0;display:flex;gap:8px;align-items:center;position:sticky;top:6px;z-index:20;border:1px solid #334155;flex-wrap:wrap}
select{background:#0f172a;color:#fff;border:1px solid #334155;padding:10px;border-radius:8px;flex:1;min-width:140px}
.basmala-out{text-align:center;font-size:26px;color:#facc15;padding:14px;background:#1e293b;border-radius:14px;margin:12px 0;border:1px solid #facc1530}
.ayah{padding:18px 16px 18px 50px;background:#1e293b;margin-bottom:10px;border-radius:12px;font-size:26px;line-height:2.8;position:relative;border:2px solid transparent}
.ayah.active{border-color:#facc15}
.word{padding:2px 6px;border-radius:8px;display:inline-block;margin:1px 2px;line-height:1.9}
.word.active-word{background:#facc15;color:#000;font-weight:bold;box-shadow:0 0 0 2px #facc15}
audio{width:100%;margin:10px 0}
.dl-ayah{position:absolute;top:8px;left:8px;background:#0f172a;border:1px solid #334155;color:#facc15;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer}
.dl-surah{background:#22c55e;color:#000;border:0;padding:9px 16px;border-radius:8px;font-weight:bold;cursor:pointer}
.font-ctrl{display:flex;gap:6px;align-items:center;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:4px 8px}
.font-ctrl button{background:#1e293b;border:1px solid #334155;color:#facc15;width:32px;height:32px;border-radius:6px;font-weight:bold;cursor:pointer;font-size:16px}
.font-ctrl button:active{background:#facc15;color:#000}
.font-ctrl span{font-size:12px;color:#94a3b8;min-width:32px;text-align:center}
</style>
</head>
<body>
<div class="top"><a href="index.html">🏠 الرئيسية</a><a class="active">🇸🇦 قرآن</a><a href="tafsir.html">📖 تفسير</a><a href="tajweed.html">✨ تجويد</a></div>
<div class="grid" id="list"></div>
<div id="reader">
<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
<button onclick="closeReader()" style="background:#facc15;border:0;padding:10px 20px;border-radius:10px;font-weight:bold;cursor:pointer;color:#000">⬅ رجوع</button>
<span id="sname" style="font-weight:bold"></span>
<button class="dl-surah" onclick="downloadSurah()">📥 تحميل السورة</button>
</div>
<div class="qari-bar"><label>🎙️</label>
<select id="qari" onchange="restartCurrent()">
<option value="ar.alafasy">مشاري العفاسي</option>
<option value="ar.husary">الحصري - مرتل</option>
<option value="ar.husarymujawwad">الحصري - مجود</option>
<option value="ar.minshawi">المنشاوي - مرتل</option>
<option value="ar.minshawimujawwad">المنشاوي - مجود</option>
<option value="ar.abdulbasitmurattal">عبدالباسط - مرتل</option>
<option value="ar.abdulsamad">عبدالباسط - مجود</option>
<option value="ar.tablawi">الطبلاوي</option>
<option value="ar.mahermuaiqly">ماهر المعيقلي</option>
<option value="ar.shaatree">أبو بكر الشاطري</option>
<option value="ar.muhammadayyoub">محمد أيوب</option>
<option value="ar.muhammadjibreel">محمد جبريل</option>
</select>
<div class="font-ctrl">
<button onclick="changeFont(-2)">-</button>
<span id="fontSizeLabel">26</span>
<button onclick="changeFont(2)">+</button>
</div>
</div>
<audio id="audio" controls></audio>
<div id="content"></div>
</div>
<script>
const surahs=[["الفاتحة",1],["البقرة",2],["آل عمران",3],["النساء",4],["المائدة",5],["الأنعام",6],["الأعراف",7],["الأنفال",8],["التوبة",9],["يونس",10],["هود",11],["يوسف",12],["الرعد",13],["إبراهيم",14],["الحجر",15],["النحل",16],["الإسراء",17],["الكهف",18],["مريم",19],["طه",20],["الأنبياء",21],["الحج",22],["المؤمنون",23],["النور",24],["الفرقان",25],["الشعراء",26],["النمل",27],["القصص",28],["العنكبوت",29],["الروم",30],["لقمان",31],["السجدة",32],["الأحزاب",33],["سبأ",34],["فاطر",35],["يس",36],["الصافات",37],["ص",38],["الزمر",39],["غافر",40],["فصلت",41],["الشورى",42],["الزخرف",43],["الدخان",44],["الجاثية",45],["الأحقاف",46],["محمد",47],["الفتح",48],["الحجرات",49],["ق",50],["الذاريات",51],["الطور",52],["النجم",53],["القمر",54],["الرحمن",55],["الواقعة",56],["الحديد",57],["المجادلة",58],["الحشر",59],["الممتحنة",60],["الصف",61],["الجمعة",62],["المنافقون",63],["التغابن",64],["الطلاق",65],["التحريم",66],["الملك",67],["القلم",68],["الحاقة",69],["المعارج",70],["نوح",71],["الجن",72],["المزمل",73],["المدثر",74],["القيامة",75],["الإنسان",76],["المرسلات",77],["النبأ",78],["النازعات",79],["عبس",80],["التكوير",81],["الانفطار",82],["المطففين",83],["الانشقاق",84],["البروج",85],["الطارق",86],["الأعلى",87],["الغاشية",88],["الفجر",89],["البلد",90],["الشمس",91],["الليل",92],["الضحى",93],["الشرح",94],["التين",95],["العلق",96],["القدر",97],["البينة",98],["الزلزلة",99],["العاديات",100],["القارعة",101],["التكاثر",102],["العصر",103],["الهمزة",104],["الفيل",105],["قريش",106],["الماعون",107],["الكوثر",108],["الكافرون",109],["النصر",110],["المسد",111],["الإخلاص",112],["الفلق",113],["الناس",114]];
let ayahsData=[],currentIdx=0,wordTimer=null,qariNow="ar.alafasy",currentSurahId=1,currentSurahName="",currentFontSize=26;
const list=document.getElementById('list');
surahs.forEach(s=>{const b=document.createElement('button');b.className='card';b.innerHTML=`${s[0]}<br><small style="color:#94a3b8">${s[1]}</small>`;b.onclick=()=>openSurah(s[0],s[1]);list.appendChild(b);});
function changeFont(delta){
 currentFontSize+=delta;
 if(currentFontSize<16) currentFontSize=16;
 if(currentFontSize>48) currentFontSize=48;
 document.getElementById('fontSizeLabel').innerText=currentFontSize;
 document.querySelectorAll('.ayah').forEach(el=>el.style.fontSize=currentFontSize+'px');
 document.querySelectorAll('.basmala-out').forEach(el=>el.style.fontSize=currentFontSize+'px');
 localStorage.setItem('quranFontSize',currentFontSize);
}
let saved=localStorage.getItem('quranFontSize');
if(saved){currentFontSize=parseInt(saved);document.getElementById('fontSizeLabel').innerText=currentFontSize;}
function closeReader(){document.getElementById('reader').style.display='none';document.getElementById('audio').pause();clearInterval(wordTimer);document.body.style.overflow='auto';document.querySelectorAll('.word.active-word').forEach(x=>x.classList.remove('active-word'));}
function restartCurrent(){qariNow=document.getElementById('qari').value;playAyahByIndex(currentIdx);}
function downloadSurah(){
 if(qariNow==='ar.tablawi'){
   window.open(`https://server12.mp3quran.net/tblawi/${String(currentSurahId).padStart(3,'0')}.mp3`,'_blank');
 }else{
   window.open(`https://cdn.islamic.network/quran/audio-surah/128/${qariNow}/${currentSurahId}.mp3`,'_blank');
 }
}
function downloadAyah(n){
 if(qariNow==='ar.tablawi') return;
 window.open(`https://cdn.islamic.network/quran/audio/128/${qariNow}/${n}.mp3`,'_blank');
}
async function openSurah(name,id){
 currentSurahId=id;currentSurahName=name;
 document.getElementById('sname').innerText=name;
 document.getElementById('reader').style.display='block';
 document.body.style.overflow='hidden';
 document.getElementById('content').innerHTML='<div style="text-align:center;padding:20px;color:#94a3b8">جاري التحميل... ⏳</div>';
 document.getElementById('reader').scrollTop=0;
 const res=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);
 const data=await res.json();ayahsData=data.data.ayahs;
 let html='';
 if(id!==1 && id!==9){html+=`<div class="basmala-out" style="font-size:${currentFontSize}px">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;}
 data.data.ayahs.forEach((a,i)=>{
   let txt=a.text.trim();
   if(i===0 && id!==1 && id!==9){txt=txt.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/,'');const p=txt.split(' ');if(p[0].includes('بِسْمِ')) txt=p.slice(4).join(' ');}
   if(!txt) return;
   const words=txt.split(' ').filter(w=>w).map(w=>`<span class="word">${w}</span>`).join(' ');
   html+=`<div class="ayah" id="ayah-${i}" style="font-size:${currentFontSize}px"><button class="dl-ayah" onclick="downloadAyah(${a.number})">⬇️ ${a.numberInSurah}</button>${words} <span style="color:#22c55e">﴿${a.numberInSurah}﴾</span></div>`;
 });
 document.getElementById('content').innerHTML=html;
 playAyahByIndex(0);
}
const WAQF_LIST=['ۘ','ۗ','ۚ','ۙ','ۖ','ۛ','ۜ','۝','۞','۟','۠','ۡ','ۢ','ۣ','ۤ','ۥ','ۦ','ۧ','ۨ','۩','ؗ','ؘ','ؙ','ؚ','ۓ','ـ','؞'];
const WAQF_WORDS=['صلى','قلى','صه','قل','ج','لا','صل','قلي','ص','مـ','ه','ـ','قلى','صلى','م','لا','ج','صه','ق','صل'];
const HIZB_MARKS=['۞','۩'];
function isWaqfMark(txt){
 let w=txt.trim().replace(/[﴿﴾۝٠-٩0-9{}]/g,'').trim();
 if(!w) return true;
 if(WAQF_LIST.includes(w)) return true;
 if(WAQF_WORDS.includes(w)) return true;
 if(/^[\u06D6-\u06ED\u08D4-\u08E1]+$/.test(w)) return true;
 if(w.length<=3 && /^[صقلجمهلا]+[ىي]?$/.test(w)) return true;
 return false;
}
function isHizbMark(txt){return txt.includes('۞')||txt.includes('۩');}
function playNextSurah(){
 if(currentSurahId<114){
   let nextId=currentSurahId+1;
   let nextName=surahs.find(s=>s[1]===nextId)[0];
   openSurah(nextName,nextId);
 }else{
   closeReader();
 }
}
function playAyahByIndex(idx){
 if(idx>=ayahsData.length){
   playNextSurah();
   return;
 }
 currentIdx=idx;
 document.querySelectorAll('.word.active-word').forEach(x=>x.classList.remove('active-word'));
 document.querySelectorAll('.ayah').forEach(el=>el.classList.remove('active'));
 const el=document.getElementById(`ayah-${idx}`);
 if(!el){playAyahByIndex(idx+1);return;}
 el.classList.add('active');el.scrollIntoView({behavior:'smooth',block:'center'});
 const audio=document.getElementById('audio');
 if(qariNow==='ar.tablawi'){
   if(idx===0){
     audio.src=`https://server12.mp3quran.net/tblawi/${String(currentSurahId).padStart(3,'0')}.mp3`;
     audio.play().catch(()=>{});
     audio.onloadedmetadata=()=>{
       const allWords=Array.from(document.querySelectorAll('.word'));
       const highlightWords=allWords.filter(span=>{
         const t=span.innerText.trim();
         if(isWaqfMark(t)) return false;
         if(isHizbMark(t)) return false;
         if(/^[﴿﴾۝٠-٩0-9{}۞۩]+$/.test(t)) return false;
         return true;
       });
       if(highlightWords.length===0) return;
       const dur=audio.duration||highlightWords.length*0.8;
       let per=(dur*1000)/highlightWords.length;
       if(per<300) per=300; if(per>900) per=900;
       clearInterval(wordTimer);let w=0;
       wordTimer=setInterval(()=>{
         document.querySelectorAll('.word.active-word').forEach(x=>x.classList.remove('active-word'));
         if(w<highlightWords.length){
           highlightWords[w].classList.add('active-word');
           highlightWords[w].scrollIntoView({behavior:'smooth',block:'center'});
           w++;
         }else{clearInterval(wordTimer);}
       },per);
     };
     audio.onended=()=>{clearInterval(wordTimer);document.querySelectorAll('.word.active-word').forEach(x=>x.classList.remove('active-word'));playNextSurah();};
     audio.onerror=()=>{setTimeout(()=>playNextSurah(),800);};
   }
   return;
 }
 audio.src=`https://cdn.islamic.network/quran/audio/128/${qariNow}/${ayahsData[idx].number}.mp3`;
 audio.play().catch(()=>{});
 audio.onloadedmetadata=()=>{
   const allWords=Array.from(el.querySelectorAll('.word'));
   const highlightWords=allWords.filter(span=>{
     const t=span.innerText.trim();
     if(isWaqfMark(t)) return false;
     if(isHizbMark(t)) return false;
     if(/^[﴿﴾۝٠-٩0-9{}۞۩]+$/.test(t)) return false;
     return true;
   });
   if(highlightWords.length===0) return;
   const dur=audio.duration||highlightWords.length*0.7;
   let per=(dur*1000)/highlightWords.length;
   if(per<350) per=350; if(per>1200) per=1200;
   clearInterval(wordTimer);let w=0;
   wordTimer=setInterval(()=>{
     document.querySelectorAll('.word.active-word').forEach(x=>x.classList.remove('active-word'));
     if(w<highlightWords.length){highlightWords[w].classList.add('active-word');w++;}else{clearInterval(wordTimer);}
   },per);
 };
 audio.onended=()=>{clearInterval(wordTimer);document.querySelectorAll('.word.active-word').forEach(x=>x.classList.remove('active-word'));playAyahByIndex(idx+1);};
 audio.onerror=()=>{setTimeout(()=>playAyahByIndex(idx+1),800);};
}
</script>
</body>
</html>
