<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف الشريف</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0b1222;color:#fff;font-family:'Tajawal',system-ui;min-height:100vh}
.header{background:#0f172a;padding:18px 12px;text-align:center;border-bottom:2px solid #22c55e}
.header h1{color:#22c55e;font-size:28px}
.header p{color:#94a3b8;font-size:14px;margin-top:6px}
.top{display:flex;flex-direction:column;gap:10px;background:#0f172aee;padding:14px;position:sticky;top:0;z-index:20;border-bottom:1px solid #1e293b}
.sel{background:#1e293b;border:1px solid #334155;padding:12px 14px;border-radius:14px;display:flex;gap:8px;align-items:center;width:95%;max-width:500px;margin:0 auto}
.sel select{background:transparent;color:#fff;border:0;width:100%;font-size:16px;outline:none;font-weight:bold}
.sel select option{background:#1e293b}
.reader{padding:12px;display:flex;flex-direction:column;min-height:calc(100vh - 170px)}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;background:#1e293b;border:1px solid #334155;padding:10px 12px;border-radius:12px;margin-bottom:12px}
.bar button{border:0;padding:9px 14px;border-radius:10px;font-weight:bold;cursor:pointer}
.fontBox{display:flex;gap:8px;align-items:center;background:#0f172a;border:1px solid #334155;padding:4px 10px;border-radius:10px}
.fontBox button{background:#1e293b;border:1px solid #334155;color:#facc15;width:36px;height:36px;border-radius:8px;font-size:18px;font-weight:bold;cursor:pointer}
.ayah-box{background:#1e293b;border:2px solid #facc15;border-radius:26px;padding:30px 20px;max-width:850px;width:100%;min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;box-shadow:0 0 0 1px #facc1520, 0 30px 60px -20px #000}
.words-line{display:flex;flex-wrap:wrap;justify-content:center;gap:8px 14px;line-height:3;font-family:'Amiri Quran', serif;text-align:center}
.word{padding:2px 8px;border-radius:8px;transition:all 0.3s ease;color:#e2e8f0}
.word.active-word{color:#facc15;background:linear-gradient(180deg,#facc1540, transparent);text-shadow:0 0 18px #facc15;transform:scale(1.25);font-weight:bold}
.ayah-num{color:#22c55e;margin-top:18px;font-size:16px}
.nav{display:flex;gap:14px;justify-content:center;margin:20px 0}
.nav button{background:#1e293b;border:1px solid #334155;color:#fff;padding:16px 28px;border-radius:14px;cursor:pointer;font-weight:bold;font-size:16px;min-width:120px}
.nav button:active{background:#facc15;color:#000}
.status{color:#94a3b8;font-size:13px;text-align:center;margin:8px 0}
audio{width:100%;border-radius:12px;margin-bottom:6px}
</style>
</head>
<body>
<div class="header">
<h1>📖 المصحف الشريف</h1>
<p>تلاوة - مزامنة الصوت مع النص حرفيا</p>
</div>

<div class="top">
<div class="sel"><span>📖</span><select id="surahSelect"></select></div>
<div class="sel"><span>🎙️</span><select id="qariSelect">
<option value="ar.alafasy">مشاري العفاسي</option>
<option value="ar.husary">الحصري - مرتل</option>
<option value="ar.minshawi">المنشاوي</option>
<option value="ar.abdulbasitmurattal">عبدالباسط عبد الصمد</option>
<option value="ar.mahermuaiqly">ماهر المعيقلي</option>
<option value="ar.shaatree">أبو بكر الشاطري</option>
<option value="ar.tablawi">الطبلاوي</option>
<option value="ar.hatemfarid">حاتم فريد الواعر</option>
</select></div>
</div>

<div class="reader">
<div class="bar">
<div><span id="sname" style="font-weight:bold"></span> <span id="counter" style="color:#94a3b8;font-size:12px"></span></div>
<div style="display:flex;gap:6px;align-items:center">
<div class="fontBox">
<button onclick="changeFont(-2)">-</button>
<span id="fontLabel" style="min-width:28px;text-align:center">32</span>
<button onclick="changeFont(2)">+</button>
</div>
<button onclick="downloadSurah()" style="background:#22c55e;color:#000">📥</button>
</div>
</div>

<audio id="audio" controls></audio>
<div class="status" id="status">اضغط على الآية للتشغيل / الإيقاف</div>

<div style="flex:1;display:flex;align-items:center;justify-content:center;padding:16px 8px">
<div class="ayah-box" id="ayahBox" onclick="togglePlay()">
<div class="words-line" id="words"></div>
<div class="ayah-num" id="ayahNum"></div>
</div>
</div>

<div class="nav">
<button onclick="prevAyah()">⬅ السابقة</button>
<button onclick="nextAyah()">التالية ➡</button>
</div>
</div>

<script>
const surahs=[["الفاتحة",1],["البقرة",2],["آل عمران",3],["النساء",4],["المائدة",5],["الأنعام",6],["الأعراف",7],["الأنفال",8],["التوبة",9],["يونس",10],["هود",11],["يوسف",12],["الرعد",13],["إبراهيم",14],["الحجر",15],["النحل",16],["الإسراء",17],["الكهف",18],["مريم",19],["طه",20],["الأنبياء",21],["الحج",22],["المؤمنون",23],["النور",24],["الفرقان",25],["الشعراء",26],["النمل",27],["القصص",28],["العنكبوت",29],["الروم",30],["لقمان",31],["السجدة",32],["الأحزاب",33],["سبأ",34],["فاطر",35],["يس",36],["الصافات",37],["ص",38],["الزمر",39],["غافر",40],["فصلت",41],["الشورى",42],["الزخرف",43],["الدخان",44],["الجاثية",45],["الأحقاف",46],["محمد",47],["الفتح",48],["الحجرات",49],["ق",50],["الذاريات",51],["الطور",52],["النجم",53],["القمر",54],["الرحمن",55],["الواقعة",56],["الحديد",57],["المجادلة",58],["الحشر",59],["الممتحنة",60],["الصف",61],["الجمعة",62],["المنافقون",63],["التغابن",64],["الطلاق",65],["التحريم",66],["الملك",67],["القلم",68],["الحاقة",69],["المعارج",70],["نوح",71],["الجن",72],["المزمل",73],["المدثر",74],["القيامة",75],["الإنسان",76],["المرسلات",77],["النبأ",78],["النازعات",79],["عبس",80],["التكوير",81],["الانفطار",82],["المطففين",83],["الانشقاق",84],["البروج",85],["الطارق",86],["الأعلى",87],["الغاشية",88],["الفجر",89],["البلد",90],["الشمس",91],["الليل",92],["الضحى",93],["الشرح",94],["التين",95],["العلق",96],["القدر",97],["البينة",98],["الزلزلة",99],["العاديات",100],["القارعة",101],["التكاثر",102],["العصر",103],["الهمزة",104],["الفيل",105],["قريش",106],["الماعون",107],["الكوثر",108],["الكافرون",109],["النصر",110],["المسد",111],["الإخلاص",112],["الفلق",113],["الناس",114]];

let ayahsData=[], sequence=[], currentSeq=0, qariNow="ar.alafasy", currentSurahId=1, isFullSurah=false, isPlaying=false, wordTimer=null, fontSize=32;

const surahSelect=document.getElementById('surahSelect'), qariSelect=document.getElementById('qariSelect'), audio=document.getElementById('audio'), wordsEl=document.getElementById('words'), ayahNumEl=document.getElementById('ayahNum'), counterEl=document.getElementById('counter'), snameEl=document.getElementById('sname'), statusEl=document.getElementById('status'), fontLabel=document.getElementById('fontLabel'), ayahBox=document.getElementById('ayahBox');

surahs.forEach(s=>{let o=document.createElement('option');o.value=s[1];o.textContent=s[0];surahSelect.appendChild(o);});

function changeFont(d){
  fontSize+=d; if(fontSize<20)fontSize=20; if(fontSize>52)fontSize=52;
  fontLabel.textContent=fontSize;
  document.querySelector('.words-line').style.fontSize=fontSize+'px';
  localStorage.setItem('fontSize',fontSize);
}
let savedFont=localStorage.getItem('fontSize'); if(savedFont){fontSize=parseInt(savedFont);fontLabel.textContent=fontSize;document.addEventListener('DOMContentLoaded',()=>{document.querySelector('.words-line').style.fontSize=fontSize+'px';});}
document.querySelector('.words-line').style.fontSize=fontSize+'px';

function syncQari(){
  qariNow=qariSelect.value;
  isFullSurah=(qariNow==='ar.tablawi'||qariNow==='ar.hatemfarid');
  localStorage.setItem('qariNow',qariNow);
  if(ayahsData.length) openSurah(currentSurahId);
}
qariSelect.onchange=syncQari;
surahSelect.onchange=()=>openSurah(parseInt(surahSelect.value));
let savedQari=localStorage.getItem('qariNow'); if(savedQari){qariSelect.value=savedQari;qariNow=savedQari;isFullSurah=(qariNow==='ar.tablawi'||qariNow==='ar.hatemfarid');}

async function openSurah(id){
  currentSurahId=id; surahSelect.value=id;
  snameEl.textContent=surahs.find(s=>s[1]==id)[0];
  localStorage.setItem('lastSurah',id);
  clearInterval(wordTimer); audio.pause();
  statusEl.textContent='جاري تحميل النص...';
  try{
    const res=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);
    const data=await res.json(); ayahsData=data.data.ayahs;
    sequence=[];
    // أعوذ
    sequence.push({t:'isti', text:'أَعُوذُ بِاللَّهِ مِنَ الشَّيْطَانِ الرَّجِيمِ', label:'الاستعاذة'});
    // بسملة (إلا التوبة)
    if(id!==9) sequence.push({t:'bas', text:'بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ', label:'البسملة'});
    ayahsData.forEach(a=>{
      let txt=a.text.trim();
      if(ayahsData.indexOf(a)===0 && id!==1 && id!==9){txt=txt.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/,'');}
      sequence.push({t:'ayah', text:txt, num:a.number, numIn:a.numberInSurah});
    });

    if(isFullSurah){
      let server=qariNow==='ar.tablawi'?'https://server12.mp3quran.net/tblawi/':'https://server11.mp3quran.net/hatem/';
      audio.src=server+String(id).padStart(3,'0')+'.mp3';
      audio.onerror=()=>{
        if(qariNow==='ar.tablawi'){audio.src=`https://server14.mp3quran.net/tblawi/${String(id).padStart(3,'0')}.mp3`; audio.play().catch(()=>{});}
      };
    }
    loadSeq(0);
  }catch(e){statusEl.textContent='فشل التحميل';}
}

function loadSeq(i){
  if(i<0||i>=sequence.length) return;
  currentSeq=i;
  const item=sequence[i];
  const words=item.text.split(' ').filter(Boolean);
  wordsEl.innerHTML=words.map(w=>`<span class="word">${w}</span>`).join(' ');
  wordsEl.style.fontSize=fontSize+'px';

  if(item.t==='ayah'){
    ayahNumEl.textContent=`﴿ ${item.numIn} ﴾`;
    counterEl.textContent=`${i} / ${sequence.length}`;
  }else{
    ayahNumEl.textContent=item.label;
    counterEl.textContent=`${i+1} / ${sequence.length}`;
  }

  if(item.t!=='ayah'){
    // استعاذة وبسملة - تظليل بطيء ثم انتقال تلقائي
    highlight(null, words.length*0.65);
    let wait = (qariNow==='ar.hatemfarid'? 3200 : 2600);
    setTimeout(()=>{ if(currentSeq===i) loadSeq(i+1); }, wait);
    return;
  }

  if(isFullSurah){
    highlight(null, words.length*0.7);
    statusEl.textContent='وضع السورة الكاملة - اضغط التالية';
    return;
  }

  // آية عادية - مزامنة دقيقة
  audio.src=`https://cdn.islamic.network/quran/audio/128/${qariNow}/${item.num}.mp3`;
  audio.onloadedmetadata=()=>{
    // لا تبدأ التظليل إلا لما الصوت يبدأ فعلا
    audio.onplay=()=>{
      // تأخير بسيط 200ms عشان الصوت يسبق
      setTimeout(()=>highlight(audio.duration), 180);
    };
    if(!audio.paused) highlight(audio.duration);
  };
  audio.onended=()=>{ if(i<sequence.length-1) setTimeout(()=>loadSeq(i+1), 400); else if(currentSurahId<114) openSurah(currentSurahId+1); };
  // شغل تلقائيا أول آية
  if(i===0 || isPlaying){
    let d = (qariNow==='ar.hatemfarid'? 1300 : 100);
    setTimeout(()=>{audio.play().then(()=>{isPlaying=true;statusEl.textContent='يتم التلاوة...';}).catch(()=>{});}, d);
  }
}

function highlight(duration, fallback){
  const els=[...wordsEl.querySelectorAll('.word')];
  clearInterval(wordTimer); els.forEach(e=>e.classList.remove('active-word'));
  let total = duration? duration*1000 : (fallback||els.length*600)*1000;
  let per = total/els.length;
  if(per<300)per=300; if(per>900)per=900;
  let idx=0;
  wordTimer=setInterval(()=>{
    els.forEach(e=>e.classList.remove('active-word'));
    if(idx<els.length){els[idx].classList.add('active-word'); idx++;}
    else clearInterval(wordTimer);
  }, per);
}

function togglePlay(){
  if(!sequence.length) return;
  if(audio.paused &&!isFullSurah){audio.play(); isPlaying=true; statusEl.textContent='يتم التلاوة...';}
  else if(!audio.paused){audio.pause(); isPlaying=false; clearInterval(wordTimer); statusEl.textContent='متوقف';}
  else{ // وضع السورة الكاملة
    if(isPlaying){audio.pause(); isPlaying=false; clearInterval(wordTimer);}
    else{audio.play().catch(()=>{}); isPlaying=true; const els=[...wordsEl.querySelectorAll('.word')]; if(!els.some(e=>e.classList.contains('active-word'))) highlight(null, els.length*0.7);}
  }
}
function nextAyah(){isPlaying=true; if(currentSeq<sequence.length-1){loadSeq(currentSeq+1); if(!isFullSurah) setTimeout(()=>audio.play().catch(()=>{}),120);} else if(currentSurahId<114) openSurah(currentSurahId+1);}
function prevAyah(){isPlaying=true; if(currentSeq>0){loadSeq(currentSeq-1); if(!isFullSurah) audio.play().catch(()=>{});}}
function downloadSurah(){
  let url = isFullSurah? (qariNow==='ar.tablawi'? `https://server12.mp3quran.net/tblawi/${String(currentSurahId).padStart(3,'0')}.mp3` : `https://server11.mp3quran.net/hatem/${String(currentSurahId).padStart(3,'0')}.mp3`) : `https://cdn.islamic.network/quran/audio-surah/128/${qariNow}/${currentSurahId}.mp3`;
  window.open(url,'_blank');
}
let last=localStorage.getItem('lastSurah'); if(last) currentSurahId=parseInt(last);
openSurah(currentSurahId);
</script>
</body>
</html>
