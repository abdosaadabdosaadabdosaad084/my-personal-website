<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التطبيق الاحترافي للقرآن الكريم</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b1222;
      --card-bg: #0f172a;
      --panel-bg: #1e293b;
      --border-color: #334155;
      --accent-gold: #facc15;
      --highlight-bg: rgba(250, 204, 21, 0.25);
      --highlight-border: #facc15;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --verse-num-color: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Control Bar */
    .top-bar {
      background-color: var(--card-bg);
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      z-index: 10;
    }

    .selectors-group {
      display: flex;
      gap: 10px;
      flex: 1;
      min-width: 280px;
    }

    .custom-select {
      flex: 1;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 8px 12px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .custom-select select {
      flex: 1;
      background: transparent;
      color: var(--text-main);
      border: none;
      font-size: 14px;
      font-weight: 700;
      outline: none;
      cursor: pointer;
    }

    .custom-select option {
      background: var(--panel-bg);
      color: var(--text-main);
    }

    .font-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 4px 10px;
      border-radius: 10px;
    }

    .font-btn {
      background: var(--border-color);
      color: var(--accent-gold);
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .font-btn:hover {
      background: #475569;
    }

    /* Audio Player Bar */
    .audio-container {
      background: var(--card-bg);
      padding: 8px 16px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    audio {
      width: 100%;
      max-width: 800px;
      height: 36px;
      border-radius: 8px;
    }

    .status-text {
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 500;
    }

    /* Quran Text Viewport */
    .quran-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      scroll-behavior: smooth;
    }

    .quran-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px 20px;
      width: 100%;
      max-width: 900px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
    }

    .bismillah {
      font-family: 'Amiri Quran', serif;
      font-size: 26px;
      text-align: center;
      color: var(--accent-gold);
      margin-bottom: 24px;
      display: block;
    }

    .quran-text {
      font-family: 'Amiri Quran', serif;
      font-size: 24px;
      line-height: 2.5;
      text-align: justify;
      text-align-last: center;
      direction: rtl;
    }

    /* Verse Styling & Yellow Synchronized Highlight */
    .ayah-span {
      display: inline;
      padding: 2px 6px;
      border-radius: 8px;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
      border: 1.5px solid transparent;
      cursor: pointer;
    }

    .ayah-span.active-ayah {
      background-color: var(--highlight-bg);
      border-color: var(--highlight-border);
      color: #ffffff;
      box-shadow: 0 0 12px rgba(250, 204, 21, 0.25);
    }

    .ayah-number {
      display: inline-block;
      color: var(--verse-num-color);
      font-size: 0.85em;
      margin: 0 6px;
      font-weight: bold;
    }

    .waqf-mark {
      color: var(--text-muted);
      font-size: 0.8em;
      margin: 0 2px;
    }
  </style>
</head>
<body>

  <!-- Top Controls Bar -->
  <div class="top-bar">
    <div class="selectors-group">
      <div class="custom-select">
        📖 <select id="surahSelect"></select>
      </div>
      <div class="custom-select">
        🎙️ <select id="qariSelect">
          <option value="ar.alafasy">مشاري العفاسي</option>
          <option value="ar.husary">محمود خليل الحصري</option>
          <option value="ar.minshawi">محمد صديق المنشاوي</option>
          <option value="ar.mahermuaiqly">ماهر المعيقلي</option>
          <option value="ar.shaatree">أبو بكر الشاطري</option>
          <option value="ar.saoodshuraym">سعود الشريم</option>
        </select>
      </div>
    </div>

    <div class="font-controls">
      <button class="font-btn" onclick="changeFontSize(-2)">-</button>
      <span id="fontSizeDisplay" style="font-weight: bold; font-size: 14px;">24</span>
      <button class="font-btn" onclick="changeFontSize(2)">+</button>
    </div>
  </div>

  <!-- Audio Player View -->
  <div class="audio-container">
    <audio id="audioPlayer" controls></audio>
    <div class="status-text" id="statusText">جاري التحميل...</div>
  </div>

  <!-- Quran Display Area -->
  <div class="quran-container" id="quranContainer">
    <div class="quran-box">
      <div class="bismillah" id="bismillahView">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>
      <div class="quran-text" id="quranTextView"></div>
    </div>
  </div>

  <script>
    const surahsList = [
      ["الفاتحة",1],["البقرة",2],["آل عمران",3],["النساء",4],["المائدة",5],["الأنعام",6],["الأعراف",7],["الأنفال",8],["التوبة",9],["يونس",10],["هود",11],["يوسف",12],["الرعد",13],["إبراهيم",14],["الحجر",15],["النحل",16],["الإسراء",17],["الكهف",18],["مريم",19],["طه",20],["الأنبياء",21],["الحج",22],["المؤمنون",23],["النور",24],["الفرقان",25],["الشعراء",26],["النمل",27],["القصص",28],["العنكبوت",29],["الروم",30],["لقمان",31],["السجدة",32],["الأحزاب",33],["سبأ",34],["فاطر",35],["يس",36],["الصافات",37],["ص",38],["الزمر",39],["غافر",40],["فصلت",41],["الشورى",42],["الزخرف",43],["الدخان",44],["الجاثية",45],["الأحقاف",46],["محمد",47],["الفتح",48],["الحجرات",49],["ق",50],["الذاريات",51],["الطور",52],["النجم",53],["القمر",54],["الرحمن",55],["الواقعة",56],["الحديد",57],["المجادلة",58],["الحشر",59],["الممتحنة",60],["الصف",61],["الجمعة",62],["المنافقون",63],["التغابن",64],["الطلاق",65],["التحريم",66],["الملك",67],["القلم",68],["الحاقة",69],["المعارج",70],["نوح",71],["الجن",72],["المزمل",73],["المدثر",74],["القيامة",75],["الإنسان",76],["المرسلات",77],["النبأ",78],["النازعات",79],["عبس",80],["التكوير",81],["الانفطار",82],["المطففين",83],["الانشقاق",84],["البروج",85],["الطارق",86],["الأعلى",87],["الغاشية",88],["الفجر",89],["البلد",90],["الشمس",91],["الليل",92],["الضحى",93],["الشرح",94],["التين",95],["العلق",96],["القدر",97],["البينة",98],["الزلزلة",99],["العاديات",100],["القارعة",101],["التكاثر",102],["العصر",103],["الهمزة",104],["الفيل",105],["قريش",106],["الماعون",107],["الكوثر",108],["الكافرون",109],["النصر",110],["المسد",111],["الإخلاص",112],["الفلق",113],["الناس",114]
    ];

    let currentSurahId = 1;
    let currentQari = "ar.alafasy";
    let currentAyahIndex = 0;
    let ayahsData = [];
    let currentFontSize = 24;

    // Elements
    const surahSelect = document.getElementById('surahSelect');
    const qariSelect = document.getElementById('qariSelect');
    const audioPlayer = document.getElementById('audioPlayer');
    const quranTextView = document.getElementById('quranTextView');
    const bismillahView = document.getElementById('bismillahView');
    const statusText = document.getElementById('statusText');
    const fontSizeDisplay = document.getElementById('fontSizeDisplay');
    const quranContainer = document.getElementById('quranContainer');

    // Populate Surahs Select Dropdown
    surahsList.forEach(s => {
      let opt = document.createElement('option');
      opt.value = s[1];
      opt.textContent = `${s[1]}. سورة ${s[0]}`;
      surahSelect.appendChild(opt);
    });

    // Font Resizing Logic
    function changeFontSize(delta) {
      currentFontSize = Math.min(Math.max(currentFontSize + delta, 16), 42);
      fontSizeDisplay.textContent = currentFontSize;
      quranTextView.style.fontSize = `${currentFontSize}px`;
      localStorage.setItem('quran_font_size', currentFontSize);
    }

    // Load Local Storage Preferences
    const savedFontSize = localStorage.getItem('quran_font_size');
    if (savedFontSize) {
      currentFontSize = parseInt(savedFontSize);
      fontSizeDisplay.textContent = currentFontSize;
      quranTextView.style.fontSize = `${currentFontSize}px`;
    }

    const savedQari = localStorage.getItem('quran_qari');
    if (savedQari) {
      currentQari = savedQari;
      qariSelect.value = savedQari;
    }

    // Event Listeners
    surahSelect.onchange = (e) => loadSurah(parseInt(e.target.value));
    qariSelect.onchange = (e) => {
      currentQari = e.target.value;
      localStorage.setItem('quran_qari', currentQari);
      playAyah(currentAyahIndex, true);
    };

    function cleanText(text) {
      return text.replace(/بِسْمِ\s*ٱللَّهِ\s*ٱلرَّحْمَٰنِ\s*ٱلرَّحِيمِ/g, '').trim();
    }

    // Fetch Surah Text Data
    async function loadSurah(surahId) {
      currentSurahId = surahId;
      surahSelect.value = surahId;
      bismillahView.style.display = (surahId === 1 || surahId === 9) ? 'none' : 'block';
      statusText.textContent = "جاري تحميل بيانات السورة...";

      try {
        const response = await fetch(`https://api.alquran.cloud/v1/surah/${surahId}/quran-uthmani`);
        const json = await response.json();
        
        if (json.code === 200) {
          ayahsData = json.data.ayahs.map(a => ({
            number: a.number,
            numberInSurah: a.numberInSurah,
            text: (surahId !== 1 && surahId !== 9 && a.numberInSurah === 1) ? cleanText(a.text) : a.text
          }));

          renderSurahText();
          playAyah(0, false);
        }
      } catch (err) {
        statusText.textContent = "حدث خطأ أثناء تحميل السورة. يرجى التحقق من الاتصال.";
      }
    }

    // Render Full Surah Text
    function renderSurahText() {
      quranTextView.innerHTML = '';
      ayahsData.forEach((ayah, index) => {
        const span = document.createElement('span');
        span.className = 'ayah-span';
        span.id = `ayah-${index}`;
        span.innerHTML = `${ayah.text} <span class="ayah-number">﴿${ayah.numberInSurah}﴾</span> `;
        
        span.onclick = () => playAyah(index, true);
        quranTextView.appendChild(span);
      });
    }

    // Play Specific Ayah & Manage Highlight Synchronization
    function playAyah(index, autoplay = true) {
      if (index < 0 || index >= ayahsData.length) return;

      currentAyahIndex = index;
      const ayah = ayahsData[index];

      // Highlight target verse with yellow indicator
      document.querySelectorAll('.ayah-span').forEach(el => el.classList.remove('active-ayah'));
      const activeEl = document.getElementById(`ayah-${index}`);
      if (activeEl) {
        activeEl.classList.add('active-ayah');
        activeEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }

      // Set Audio Stream Source
      audioPlayer.src = `https://cdn.islamic.network/quran/audio/128/${currentQari}/${ayah.number}.mp3`;
      statusText.textContent = `${surahsList.find(s => s[1] === currentSurahId)[0]} - الآية (${ayah.numberInSurah} من ${ayahsData.length})`;

      if (autoplay) {
        audioPlayer.play().catch(() => {});
      }
    }

    // Uninterrupted Next Verse Playback
    audioPlayer.onended = () => {
      if (currentAyahIndex < ayahsData.length - 1) {
        playAyah(currentAyahIndex + 1, true);
      } else if (currentSurahId < 114) {
        // Move automatically to next Surah
        loadSurah(currentSurahId + 1);
      }
    };

    // Initialize Page
    loadSurah(currentSurahId);
  </script>
</body>
</html>
