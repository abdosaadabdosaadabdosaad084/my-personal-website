<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>التلاوة</title><link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0}body{background:#0b1222;color:#fff;font-family:'Tajawal';height:100vh;display:flex;flex-direction:column}.top{background:#0f172a;padding:10px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b}.top a{color:#22c55e;text-decoration:none;font-weight:bold}.fontCtrl{display:flex;gap:6px;align-items:center;background:#1e293b;border:1px solid #334155;padding:4px 8px;border-radius:10px}.fontCtrl button{background:#334155;color:#facc15;border:0;width:32px;height:32px;border-radius:8px;font-weight:bold;font-size:18px}audio{width:96%;margin:8px auto;display:block;height:36px}.ayahWrap{flex:1;display:flex;justify-content:center;align-items:flex-start;padding:10px;overflow:auto}.ayah-box{background:#1e293b;border:2px solid #facc15;border-radius:14px;padding:16px;width:100%;max-width:760px}.words-line{font-family:'Amiri Quran';font-size:22px;line-height:2.8;text-align:center;direction:rtl}.word{display:inline-block;margin:3px 7px;padding:2px 6px;border-radius:6px;position:relative}.word.active-word{color:#facc15;background:#facc1530}.word.active-word::after{content:'';position:absolute;left:0;right:0;bottom:-4px;height:4px;background:#000;border-radius:2px}.waqf{display:inline-block;color:#64748b;margin:0 4px}.ayahNum{color:#22c55e;text-align:center;margin-top:12px}.nav{display:flex;gap:12px;justify-content:center;padding:10px}.nav button{background:#1e293b;border:1px solid #334155;color:#fff;padding:10px 20px;border-radius:10px;font-weight:bold}.status{text-align:center;color:#facc15;font-size:12px;min-height:16px}</style></head><body><div class="top"><a href="index.html">⬅ الرئيسية</a><div id="sname"></div><div class="fontCtrl"><button onclick="changeFont(-2)">-</button><span id="fSize">22</span><button onclick="changeFont(2)">+</button></div></div><audio id="audio" controls autoplay></audio><div class="status" id="status"></div><div class="ayahWrap"><div class="ayah-box"><div class="words-line" id="words"></div><div class="ayahNum" id="aNum"></div></div></div><div class="nav"><button onclick="prev()">السابقة</button><button onclick="next()">التالية</button></div><script>const WAQF=new Set(["ج","ۚ","ۖ","ۗ","ۘ","ۙ","ۛ","ۜ","۝","۞","۩","صه","قلى","صلى","لا","م","ۓ"]);let seq=[],cur=0,surahId=11,fontSize=22,wordTimer=null;const audio=document.getElementById('audio'),wordsEl=document.getElementById('words'),aNumEl=document.getElementById('aNum'),snameEl=document.getElementById('sname'),statusEl=document.getElementById('status'),fSizeEl=document.getElementById('fSize');const surahNames=["","الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];function getQari(){return localStorage.getItem('qari')||'ar.alafasy';}function isFullQari(q){return q==='ar.tablawi'||q==='ar.hatemfarid';}function cleanBasmala(txt,sid,isFirst){if(sid===1)return txt;if(sid===9)return txt;if(isFirst){return txt.replace(/بِسْمِ.*الرَّحِيمِ/,'').replace(/بسم الله الرحمن الرحيم/,'').trim();}return txt;}function changeFont(d){fontSize+=d;if(fontSize<16)fontSize=16;if(fontSize>38)fontSize=38;fSizeEl.textContent=fontSize;wordsEl.style.fontSize=fontSize+'px';localStorage.setItem('fs',fontSize);}let fs=localStorage.getItem('fs');if(fs){fontSize=parseInt(fs);fSizeEl.textContent=fontSize;wordsEl.style.fontSize=fontSize+'px';}async function openSurah(id){surahId=id;snameEl.textContent=surahNames[id];clearInterval(wordTimer);audio.pause();let res=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);let data=await res.json();seq=[];data.data.ayahs.forEach((a,idx)=>{let txt=cleanBasmala(a.text.trim(),id,idx===0);if(!txt)return;seq.push({text:txt,tokens:txt.split(' ').filter(Boolean),num:a.number,numIn:a.numberInSurah});});load(0,true);}function render(tokens){let h='';tokens.forEach(t=>{if(WAQF.has(t))h+=`<span class="waqf">${t}</span> `;else h+=`<span class="word">${t}</span> `;});return h;}function load(idx,autoplay){if(idx<0||idx>=seq.length)return;clearInterval(wordTimer);cur=idx;let it=seq[idx];wordsEl.innerHTML=render(it.tokens);aNumEl.textContent=`﴿ ${it.numIn} ﴾`;statusEl.textContent=`${surahNames[surahId]} - آية ${it.numIn}`;let qari=getQari();if(isFullQari(qari)){let base=qari==='ar.tablawi'?'https://server12.mp3quran.net/tblawi/':'https://server11.mp3quran.net/hatem/';audio.src=base+String(surahId).padStart(3,'0')+'.mp3';audio.onloadedmetadata=()=>{if(autoplay)audio.play().catch(()=>{});let per=audio.duration/seq.length;audio.currentTime=per*idx;};audio.ontimeupdate=()=>{if(!audio.duration)return;let per=audio.duration/seq.length;let ci=Math.floor(audio.currentTime/per);if(ci!==cur&&ci<seq.length)load(ci,false);};}else{audio.src=`https://cdn.islamic.network/quran/audio/128/${qari}/${it.num}.mp3`;audio.onloadedmetadata=()=>{if(autoplay)audio.play().catch(()=>{});};audio.onplay=()=>{highlight();};audio.onended=()=>{if(idx<seq.length-1)setTimeout(()=>load(idx+1,true),500);else if(surahId<114)openSurah(surahId+1);};audio.ontimeupdate=null;}}function highlight(){clearInterval(wordTimer);let els=[...wordsEl.querySelectorAll('.word')];if(!els.length||!audio.duration)return;let d=audio.duration;let per=(d*1000)/els.length;if(per<300)per=300;if(per>850)per=850;let i=0;wordTimer=setInterval(()=>{els.forEach(e=>e.classList.remove('active-word'));if(i<els.length){els[i].classList.add('active-word');i++;}else clearInterval(wordTimer);},per);}function next(){load(cur+1,true);}function prev(){load(cur-1,true);}let url=new URLSearchParams(location.search);let s=url.get('surah');if(s)surahId=parseInt(s);let last=localStorage.getItem('lastS');if(!s&&last)surahId=parseInt(last);localStorage.setItem('lastS',surahId);openSurah(surahId);</script></body></html>
