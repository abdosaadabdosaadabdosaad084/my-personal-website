<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن</title>
<style>
body{background:#0f172a;color:#fff;font-family:Tahoma;margin:0;padding:10px}
.top{display:flex;gap:6px;position:sticky;top:0;background:#0f172acc;backdrop-filter:blur(8px);z-index:30;padding:10px 0}
.top a{background:#1e293b;padding:9px 12px;border-radius:10px;color:#fff;text-decoration:none;font-size:13px}
.top a.active{background:#22c55e;color:#000;font-weight:bold}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.card{background:#1e293b;padding:14px;border-radius:12px;text-align:center;border:0;width:100%;color:#fff;cursor:pointer}
#reader{display:none;position:fixed;inset:0;background:#0f172a;z-index:100;overflow-y:auto;padding:12px}
.qari-bar{background:#1e293b;padding:10px;border-radius:10px;margin:10px 0;display:flex;gap:8px;align-items:center;position:sticky;top:5px;z-index:20}
select{background:#0f172a;color:#fff;border:1px solid #334155;padding:8px;border-radius:8px;width:100%}
.basmala-out{text-align:center;font-size:26px;color:#facc15;padding:14px;background:#1e293b;border-radius:14px;margin:12px 0;border:1px solid #facc1530}
.ayah{padding:16px;background:#1e293b;margin-bottom:8px;border-radius:10px;font-size:24px;line-height:2.9;position:relative;border:2px solid transparent}
.ayah.active{border-color:#facc15}
.word{padding:2px 5px;border-radius:7px;display:inline-block;transition:.2s;margin:1px 2px;line-height:1.8}
.word.active-word{background:#facc15;color:#000;font-weight:bold;transform:none;box-shadow:0 0 0 2px #facc15}
audio{width:100%;margin:8px 0}
.dl-ayah{position:absolute;top:6px;left:6px;background:#0f172a;border:1px solid #334155;color:#facc15;border-radius:6px;padding:2px 7px;font-size:12px;cursor:pointer}
.dl-surah{background:#22c55e;color:#000;border:0;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer;margin-right:8px}
</style>
</head>
<body>
<div class="top"><a href="index.html">🏠 الرئيسية</a><a class="active">🇸🇦 قرآن</a><a href="tafsir.html">📖 تفسير</a><a href="tajweed.html">✨ تجويد</a></div>
<div class="grid" id="list"></div>
<div id="reader">
<div style="display:flex;align-items:center;gap:8px">
<button onclick="closeReader()" style="background:#facc15;border:0;padding:10px 18px;border-radius:8px;font-weight:bold;cursor:pointer">⬅ رجوع</button>
<span id="sname" style="font-weight:bold"></span>
<button class="dl-surah" onclick="downloadSurah()">📥 تحميل السورة</button>
</div>
<div class="qari-bar"><label>🎙️</label>
<select id="qari" onchange="restartCurrent()">
<option value="ar.alafasy">مشاري العفاسي</option>
<option value="ar.husary">الحصري</option>
<option value="ar.minshawi">المنشاوي</option>
<option value="ar.mahermuaiqly">المعيقلي</option>
<option value="ar.shaatree">الشاطري</option>
</select></div>
<audio id="audio" controls></audio>
<div id="content"></div>
</div>
<script>
// ... نفس باقي السكريبت اللي بعته مع اهم سطر اصلاح:
function playAyahByIndex(idx){
 if(idx>=ayahsData.length) return;
 currentIdx=idx;
 document.querySelectorAll('.word.active-word').forEach(x=>x.classList.remove('active-word'));
 document.querySelectorAll('.ayah').forEach(el=>el.classList.remove('active'));
// باقي الدالة كما هي
}
</script>
</body>
</html>
