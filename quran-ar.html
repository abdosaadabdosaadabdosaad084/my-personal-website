<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>
<style>
body{margin:0;background:#0b1220;color:#fff;font-family:Tahoma;padding:12px;padding-bottom:120px}
.top{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
select,.btn{padding:10px;border-radius:10px;background:#1e293b;color:#fff;border:1px solid #334155}
.quran{background:#fff;color:#000;padding:20px;border-radius:14px;font-size:28px;line-height:2.5;text-align:center;font-family:'Amiri',serif;max-width:800px;margin:0 auto}
.player{position:fixed;bottom:0;left:0;right:0;background:#1e293b;padding:12px;border-top:1px solid #334155}
audio{width:100%}
a{color:#22c55e;text-decoration:none}
</style>
</head>
<body>
<div class="top">
<a href="index.html" class="btn">🏠 الرئيسية</a>
<select id="surah"></select>
</div>
<div id="text" class="quran">اختر سورة...</div>
<div class="player"><audio id="audio" controls></audio></div>
<script>
const names=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const sel=document.getElementById('surah');
names.forEach((n,i)=>{let o=document.createElement('option');o.value=i+1;o.textContent=(i+1)+". "+n;sel.appendChild(o);});
async function load(num){
 let r=await fetch(`https://api.alquran.cloud/v1/surah/${num}/quran-uthmani`);
 let j=await r.json();
 document.getElementById('text').innerHTML=j.data.ayahs.map(a=>a.text+` ﴿${a.numberInSurah}﴾`).join(' ');
 document.getElementById('audio').src=`https://server11.mp3quran.net/hatem/${String(num).padStart(3,'0')}.mp3`;
 document.getElementById('audio').play().catch(()=>{});
}
sel.onchange=e=>load(e.target.value);
load(1);
</script>
</body>
</html>
