<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن مع التظليل كلمة بكلمة</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:Tahoma;padding-bottom:160px}
.top{position:sticky;top:0;background:#0f172af2;backdrop-filter:blur(10px);padding:10px;border-bottom:1px solid #1e293b;z-index:10;display:flex;gap:6px;flex-wrap:wrap}
.top a,.top select,.top button{background:#1e293b;color:#fff;border:1px solid #334155;padding:8px 10px;border-radius:10px;font-size:12px;cursor:pointer;text-decoration:none}
.player{position:fixed;bottom:0;left:0;right:0;background:#1e293b;border-top:1px solid #334155;padding:10px;z-index:20}
.player audio{width:100%}
.quran-box{max-width:850px;margin:10px auto;background:#fff;color:#111;padding:22px;border-radius:16px;line-height:2.9;font-size:26px;text-align:justify;font-family:"Amiri",serif}
.word{cursor:pointer;padding:2px 3px;border-radius:6px;transition:.15s}
.word.active{background:#facc15;color:#000;font-weight:bold;box-shadow:0 0 0 2px #facc15}
.waqf{color:#22c55e;padding:0 4px;user-select:none} /* علامات الوقف - مش بتتظلل */
.ayah-end{color:#16a34a;font-size:18px;user-select:none}
.surah-item{display:flex;justify-content:space-between;background:#1e293b;border:1px solid #334155;padding:12px;border-radius:12px;margin:6px 0;cursor:pointer}
.surah-item.active{border-color:#facc15;background:#3f2e00}
</style>
</head>
<body>
<div class="top">
<a href="index.html">🏠 الرئيسية</a>
<select id="reciter">
<option value="1">عبدالباسط مرتل (تظليل دقيق)</option>
<option value="7" selected>العجمي - تظليل دقيق</option>
<option value="6">الحصري - تظليل دقيق</option>
<option value="9">المنشاوي - تظليل دقيق</option>
<option value="hatem">حاتم فريد - أصلي (بدون كلمة بكلمة)</option>
</select>
<select id="surahSel"></select>
<label style="display:flex;align-items:center;gap:4px;background:#14532d;padding:6px 10px;border-radius:20px"><input type="checkbox" id="autoNext" checked> تشغيل تلقائي ⏭️</label>
<button onclick="nextS()">التالي</button>
</div>
<div id="list" style="max-width:850px;margin:0 auto;padding:0 10px"></div>
<div class="quran-box" id="text">جاري التحميل...</div>
<div class="player"><div id="now">اختر سورة</div><audio id="audio" controls></audio></div>

<script>
const surahNames=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const reciterMap={afs:"https://server8.mp3quran.net/afs/",hatem:"https://server11.mp3quran.net/hatem/"};
let curSurah=111; let timestamps=[]; let wordsData=[];
const audio=document.getElementById('audio');
const surahSel=document.getElementById('surahSel');
surahNames.forEach((n,i)=>{let o=document.createElement('option');o.value=i+1;o.textContent=(i+1)+". "+n;surahSel.appendChild(o);let d=document.createElement('div');d.className='surah-item';d.id='s-'+(i+1);d.innerHTML=`<span>${i+1}. ${n}</span><span>▶️</span>`;d.onclick=()=>loadSurah(i+1);document.getElementById('list').appendChild(d);});

async function loadSurah(num){
 curSurah=num; surahSel.value=num;
 document.querySelectorAll('.surah-item').forEach(e=>e.classList.remove('active'));
 document.getElementById('s-'+num)?.classList.add('active');
 document.getElementById('now').textContent=surahNames[num-1];
 const rec=document.getElementById('reciter').value;
 let audioUrl, tsData;
 if(rec==='hatem'){audioUrl=reciterMap.hatem+String(num).padStart(3,'0')+'.mp3'; document.getElementById('text').innerHTML='جاري تحميل النص... (حاتم فريد - تظليل تقديري)';}
 else{
   try{
     let r=await fetch(`https://api.quran.com/api/v4/chapter_recitations/${rec}/${num}?segments=true`);
     let j=await r.json(); audioUrl=j.audio_file.audio_url; tsData=j.audio_file.timestamp;
     timestamps=tsData?.verse_timings || tsData || [];
   }catch(e){audioUrl=`https://download.quranicaudio.com/quran/${rec}/${num}.mp3`;}
 }
 // جلب الكلمات بدون علامات وقف
 try{
   let w=await fetch(`https://api.quran.com/api/v4/verses/by_chapter/${num}?words=true&per_page=300&word_fields=text_uthmani`);
   let wd=await w.json(); wordsData=wd.verses;
   let html='';
   wd.verses.forEach(v=>{
     v.words.forEach(word=>{
       if(word.char_type_name==='end' || word.text_uthmani.match(/[۝۞۩؞]/)){html+=`<span class="ayah-end"> ﴿${v.verse_number}﴾ </span>`;return;}
       if(word.text_uthmani.match(/[ۚۛۜۗۖۙۘۥ]/)){html+=`<span class="waqf">${word.text_uthmani}</span> `;return;}
       html+=`<span class="word" data-loc="${word.location}">${word.text_uthmani}</span> `;
     });
   });
   document.getElementById('text').innerHTML=html;
 }catch(e){}

 audio.src=audioUrl; audio.play();
}

// تظليل كلمة بكلمة مع الصوت - بدون وقف
audio.addEventListener('timeupdate',()=>{
 if(!timestamps.length || document.getElementById('reciter').value==='hatem'){
   // تقديري لحاتم فريد
   let ws=document.querySelectorAll('.word');
   if(!ws.length||!audio.duration) return;
   let idx=Math.floor((audio.currentTime/audio.duration)*ws.length);
   ws.forEach(w=>w.classList.remove('active')); ws[idx]?.classList.add('active');
   return;
 }
 let ms=audio.currentTime*1000;
 // timestamps من quran.com فيه segments لكل كلمة
 let seg=timestamps.flatMap(v=>v.segments||[]).find(s=>ms>=s[0]&&ms<s[1]&&s[2]);
 // البحث الأصلي
 for(let vt of timestamps){
   for(let seg of (vt.segments||[])){
     if(ms>=seg[0] && ms<seg[1]){
       document.querySelectorAll('.word').forEach(w=>w.classList.remove('active'));
       let target=document.querySelector(`.word[data-loc="${vt.verse_key}:${seg[2]}"]`) || document.querySelector(`.word[data-loc^="${vt.verse_key}:"]`);
       target?.classList.add('active');
       target?.scrollIntoView({behavior:'smooth',block:'center'});
       return;
     }
   }
 }
});

audio.addEventListener('ended',()=>{if(document.getElementById('autoNext').checked && curSurah<114) loadSurah(curSurah+1);});
function nextS(){if(curSurah<114) loadSurah(curSurah+1);}
surahSel.onchange=e=>loadSurah(parseInt(e.target.value));
document.getElementById('reciter').onchange=()=>loadSurah(curSurah);
loadSurah(111);
</script>
</body>
</html>
