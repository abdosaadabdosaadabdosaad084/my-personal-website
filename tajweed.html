<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دليل أحكام التجويد الشامل</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b1222;
      --card-bg: #0f172a;
      --panel-bg: #1e293b;
      --border-color: #334155;
      --accent-blue: #38bdf8;
      --accent-gold: #facc15;
      --accent-green: #22c55e;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: 'Tajawal', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header Design */
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      padding: 24px 16px;
      text-align: center;
      border-bottom: 2px solid var(--accent-blue);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }

    .header h1 {
      color: var(--accent-blue);
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    /* Search Container */
    .search-container {
      max-width: 900px;
      margin: 16px auto 8px auto;
      padding: 0 16px;
      width: 100%;
    }

    .search-input {
      width: 100%;
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 12px;
      color: var(--text-main);
      font-family: 'Tajawal', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-input:focus {
      border-color: var(--accent-blue);
    }

    /* Main Container */
    .container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 16px;
      width: 100%;
      flex: 1;
    }

    /* Category Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      padding: 16px 20px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card:hover {
      border-color: var(--accent-blue);
      transform: translateY(-2px);
      box-shadow: 0 6px 15px rgba(56, 189, 248, 0.15);
    }

    .card.active {
      border-color: var(--accent-gold);
      background: #1e3a5f;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text-main);
    }

    .card-badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-blue);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
    }

    /* Details Panel */
    .detail-panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }

    .panel-header {
      color: var(--accent-blue);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* Rules Item Styling */
    .rule-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-right: 4px solid var(--accent-gold);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
    }

    .rule-name {
      color: var(--accent-green);
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .rule-letters {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 10px;
    }

    .rule-example {
      font-family: 'Amiri Quran', serif;
      font-size: 22px;
      background: rgba(15, 23, 42, 0.6);
      padding: 10px 16px;
      border-radius: 8px;
      text-align: center;
      color: var(--accent-gold);
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <h1>📘 موسوعة أحكام التجويد الميسرة</h1>
    <p>دليل مرجعي شامل لقواعد وركائز تلاوة القرآن الكريم</p>
  </div>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="🔍 ابحث عن حكم أو مثال (مثل: الإظهار، القلقلة، مد...)" oninput="filterRules()">
  </div>

  <!-- Main Content -->
  <div class="container">
    <div class="grid" id="cardsGrid"></div>
    <div class="detail-panel" id="detailPanel"></div>
  </div>
