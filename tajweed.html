<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>أحكام التجويد</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0b1222;color:#fff;font-family:'Tajawal'}
.header{background:linear-gradient(135deg,#0f172a,#1e3a5f);padding:22px;text-align:center;border-bottom:2px solid #38bdf8}
.header h1{color:#38bdf8;font-size:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.item{background:#1e293b;border:1px solid #334155;padding:16px;border-radius:14px;cursor:pointer}
.detail{background:#0f172a;border:1px solid #1e293b;margin:12px;border-radius:16px;padding:18px}
.rule{color:#22c55e;font-weight:bold;font-size:20px;margin:10px 0}
.ex{font-family:'Amiri Quran';font-size:24px;background:#1e293b;padding:12px;border-radius:10px;text-align:center;margin:8px 0;border-right:4px solid #facc15}
</style>
</head>
<body>
<div class="header"><h1>📘 أحكام التجويد - من الألف إلى الياء</h1></div>
<div class="grid">
<div class="item" onclick="show(0)"><h3>النون الساكنة والتنوين</h3><p>5 أحكام</p></div>
<div class="item" onclick="show(1)"><h3>الميم الساكنة</h3><p>3 أحكام</p></div>
<div class="item" onclick="show(2)"><h3>المدود</h3><p>9 أنواع</p></div>
<div class="item" onclick="show(3)"><h3>القلقلة</h3><p>قطب جد</p></div>
<div class="item" onclick="show(4)"><h3>التفخيم والترقيق</h3><p>الراء واللام</p></div>
<div class="item" onclick="show(5)"><h3>المخارج والصفات</h3><p>17 مخرج</p></div>
</div>
<div id="box" class="detail"></div>
<script>
const data=[
{title:"النون الساكنة والتنوين",list:["الإظهار: ء هـ ع ح غ خ - مثال: مِنْ هَادٍ","الإدغام بغنة: ي ن م و - مِنْ نِعْمَةٍ","الإدغام بغير غنة: ل ر - مِنْ لَدُنْهُ","الإقلاب: ب - مِنْ بَعْدِ تقلب ميما","الإخفاء: باقي الحروف - كُنْتُمْ"]},
{title:"الميم الساكنة",list:["الإخفاء الشفوي: ب - هُمْ بِهِ","إدغام المثلين: م - لَكُمْ مَا","الإظهار الشفوي: باقي الحروف - لَعَلَّكُمْ تَتَّقُونَ"]},
{title:"المدود",list:["الطبيعي حركتان: قَالَ","البدل: آمَنُوا","المتصل 4-5: جَاءَ","المنفصل 2-4-5: إِنَّا أَنْزَلْنَاهُ","اللازم 6 حركات: الْحَاقَّةُ","العارض للسكون: الْعَالَمِينَ","اللين: خَوْفٍ"]},
{title:"القلقلة - قطب جد",list:["قلقلة صغرى وسط الكلمة: يَقْطَعُونَ","قلقلة كبرى آخر الكلمة: الْفَلَقْ","الغنة: إِنَّ - ثُمَّ"]},
{title:"التفخيم والترقيق",list:["الراء مفخمة إذا مفتوحة أو مضمومة: رَمَضَانَ","الراء مرققة إذا مكسورة: رِزْقًا","لام لفظ الجلالة مفخمة بعد فتح أو ضم: عَبْدُ اللَّهِ","مرققة بعد كسر: بِسْمِ اللَّهِ"]},
{title:"مخارج الحروف 17",list:["الجوف: حروف المد ا و ي","الحلق: 6 حروف ء هـ ع ح غ خ","اللسان: 10 مخارج","الشفتان: الواو والباء والميم","الخيشوم: الغنة"]}
];
function show(i){let d=data[i];let h=`<h2 style="color:#38bdf8">${d.title}</h2>`;d.list.forEach(e=>{h+=`<div class="ex">${e}</div>`});document.getElementById('box').innerHTML=h;window.scrollTo(0,300);}
show(0);
</script>
</body>
</html>
