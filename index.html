<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف الشريف</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.png">
<link rel="apple-touch-icon" href="./icon.png">
<meta name="theme-color" content="#22c55e">
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#fff;font-family:Tahoma;text-align:center;padding:20px}
.logo{width:110px;height:110px;border-radius:22px;margin:20px auto;display:block}
h1{color:#22c55e} .btn{display:block;background:#1e293b;color:#fff;padding:18px;border-radius:14px;margin:12px 0;text-decoration:none;font-size:18px;font-weight:bold}
.btn.main{background:#22c55e;color:#000} #installBtn{background:#facc15;color:#000;display:none}
</style>
</head>
<body>
<img src="./icon.png" class="logo">
<h1>📖 المصحف الشريف</h1>
<p>اقرأ واسمع القرآن حتى بدون إنترنت</p>
<a id="installBtn" class="btn">📲 تثبيت التطبيق</a>
<a href="quran-ar.html" class="btn main">🇸🇦 القرآن العربي مع التلاوة</a>
<a href="quran-en.html" class="btn">🇺🇸 القرآن الإنجليزي</a>
<a href="tafsir.html" class="btn">📖 التفسير</a>
<script>
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js')}
let promptEvent; 
const btn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{
 e.preventDefault(); promptEvent=e; btn.style.display='block';
});
btn.addEventListener('click',async()=>{
 if(promptEvent){promptEvent.prompt(); await promptEvent.userChoice; promptEvent=null; btn.style.display='none';}
});
window.addEventListener('appinstalled',()=>{btn.style.display='none';});
</script>
</body>
</html>
