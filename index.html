<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف الشريف</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="theme-color" content="#22c55e">
<style>
*{box-sizing:border-box}
body{margin:0;background:#0f172a;color:#fff;font-family:Tahoma;text-align:center;padding:20px}
.logo{width:110px;height:110px;border-radius:22px;margin:20px auto;display:block;box-shadow:0 8px 20px #0005}
h1{color:#22c55e;margin:10px 0;font-size:32px}
p{color:#94a3b8}
.btn{display:block;background:#1e293b;color:#fff;padding:18px;border-radius:14px;margin:12px 0;text-decoration:none;font-size:18px;font-weight:bold;border:1px solid #334155}
.btn.main{background:#22c55e;color:#000}
.btn.install{background:#facc15;color:#000;display:none}
</style>
</head>
<body>

<img src="icon.png" class="logo" alt="المصحف">

<h1>📖 المصحف الشريف</h1>
<p>اقرأ واسمع القرآن في أي وقت حتى بدون إنترنت بعد التثبيت</p>

<a id="installBtn" class="btn install">📲 تثبيت التطبيق</a>

<a href="quran-ar.html" class="btn main">🇸🇦 القرآن العربي مع التلاوة</a>
<a href="quran-en.html" class="btn">🇺🇸 القرآن الإنجليزي</a>
<a href="tafsir.html" class="btn">📖 التفسير</a>

<p style="margin-top:30px;font-size:12px;color:#475569">abdosaadabdosaadabdosaad084.github.io</p>

<script>
// تسجيل الـ Service Worker
if('serviceWorker' in navigator){
 navigator.serviceWorker.register('sw.js');
}

// زرار التثبيت
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
 e.preventDefault();
 deferredPrompt = e;
 installBtn.style.display = 'block';
});
installBtn.addEventListener('click', async () => {
 if(deferredPrompt){
   deferredPrompt.prompt();
   const { outcome } = await deferredPrompt.userChoice;
   deferredPrompt = null;
   installBtn.style.display = 'none';
 }
});
</script>

</body>
</html>
