:root{--bg:#070a14;--bg2:#0d1224;--cyan:#00d4ff;--purple:#7c3aed;--green:#25D366;--muted:#94a3b8;--border:rgba(255,255,255,.08)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Cairo',sans-serif}
body{background:var(--bg);color:#fff;overflow-x:hidden}
.glass{background:rgba(255,255,255,.04);backdrop-filter:blur(16px);border:1px solid var(--border)}
a{text-decoration:none;color:inherit}

.nav{display:flex;gap:6px;background:rgba(255,255,255,.04);padding:6px;border-radius:999px;border:1px solid var(--border)}
.nav button{padding:8px 16px;border-radius:999px;border:none;background:transparent;color:#ffffffb0;font-weight:700;font-size:13px;cursor:pointer}
.nav button.active{background:#fff;color:#000}
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;padding:60px 6%;align-items:center}
.hero h1{font-size:52px;line-height:1.05;font-weight:900}
.gradient{background:linear-gradient(90deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.btn{display:inline-flex;align-items:center;gap:8px;height:52px;padding:0 26px;border-radius:999px;font-weight:800;border:none;cursor:pointer}
.btn-cyan{background:var(--cyan);color:#000}
.btn-glass{background:rgba(255,255,255,.06);border:1px solid var(--border);color:#fff}
.profile-wrap{position:relative;width:380px;height:380px;margin:auto}
.profile-wrap img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:6px solid rgba(255,255,255,.1);box-shadow:0 0 60px rgba(0,212,255,.4)}
section{padding:70px 6%}
h2{font-size:38px;font-weight:900;margin-bottom:10px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:30px}
.card{border-radius:24px;padding:24px;cursor:pointer;transition:.35s}
.card:hover{transform:translateY(-6px);border-color:rgba(0,212,255,.25);box-shadow:0 20px 40px rgba(0,0,0,.4)}
.portfolio{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.port-item{aspect-ratio:4/3;border-radius:20px;position:relative;overflow:hidden;cursor:pointer;display:grid;place-items:center;font-weight:800}
.blog-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.whatsapp-float{position:fixed;bottom:20px;left:20px;z-index:50;width:60px;height:60px;background:var(--green);border-radius:50%;display:grid;place-items:center;font-size:28px;box-shadow:0 8px 24px rgba(37,211,102,.4);animation:pulse 2s infinite;cursor:pointer}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(37,211,102,.7)}70%{box-shadow:0 0 0 18px rgba(37,211,102,0)}100%{box-shadow:0 0 0 0 rgba(37,211,102,0)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(10px);z-index:60;display:none;place-items:center;padding:20px}
.modal.active{display:grid}
.modal-box{background:#12182e;border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:26px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
input,textarea{width:100%;background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:12px;padding:12px 14px;color:#fff;outline:none;margin-bottom:10px}
.filter{display:flex;gap:6px;background:rgba(255,255,255,.04);padding:5px;border-radius:999px;border:1px solid var(--border);width:fit-content}
.filter button{padding:6px 14px;border-radius:999px;border:none;background:transparent;color:#ffffff80;font-weight:700;cursor:pointer}
.filter button.active{background:#fff;color:#000}
@media(max-width:900px){.hero{grid-template-columns:1fr}.nav{display:none}.hero h1{font-size:34px}.profile-wrap{width:280px;height:280px}}
