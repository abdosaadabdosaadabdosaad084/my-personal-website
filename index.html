<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>القرآن الكريم</title>
<link rel="icon" href="https://cdn-icons-png.flaticon.com/512/3137/3137819.png">
<link rel="manifest" href="manifest.json?v=99">
<meta name="theme-color" content="#0f172a">

<!-- دي اللي هتصلح صورة فيسبوك -->
<meta property="og:title" content="القرآن الكريم - استماع وتفسير">
<meta property="og:description" content="استمع وحمل القرآن الكريم كامل مع تتبع الكلمات">
<meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/3137/3137819.png">
<meta property="og:url" content="https://abdosaadabdosaadabdosaad084.github.io/my-personal-website/">
<meta property="og:type" content="website">

<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0f172a;color:#e2e8f0}
.header{position:sticky;top:0;background:#1e293b;padding:8px;border-bottom:1px solid #334155;z-index:10}
.top{max-width:980px;margin:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:center}
button,select,audio{border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;padding:7px 10px}
button{background:#334155;font-weight:bold}
.btn-down{background:#22c55e;color:#000}
.btn-down-all{background:#facc15;color:#000}
#reader{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;line-height:3.2;font-family:'Amiri',serif;font-size:30px;max-width:900px;margin:14px auto;display:none}
.word{padding:0 2px;border-radius:4px;transition:.2s}
.word.lit{background:#facc15!important;color:#000!important}
.basmala{display:block;text-align:center;margin:0 0 22px 0;font-size:32px;color:#facc15}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-width:900px;margin:14px auto}
.surah{background:#1e293b;border:1px solid #334155;padding:12px;border-radius:12px;text-align:center;cursor:pointer}
#installBtn{display:none;background:#facc15;color:#000}
</style>
</head>
<body>
<div class="header"><div class="top">
<button onclick="showList()">📚 السور</button>
<button id="installBtn">📲 تثبيت</button>
<button onclick="changeFont(-2)">A-</button><span id="fl">30</span><button onclick="changeFont(2)">A+</button>
<select id="rec" onchange="if(cur>=0)playAyah(cur)">
<option value="ar.alafasy">العفاسي</option>
<option value="ar.husary">الحصري</option>
<option value="ar.abdulbasitmurattal">عبدالباسط</option>
<option value="ar.mahermuaiqly">المعيقلي</option>
<option value="ar.minshawi">المنشاوي</option>
</select>
<button class="btn-down" onclick="downloadAyah()">⬇️ الآية</button>
<button class="btn-down-all" onclick="downloadSurahAll()">⬇️ السورة كاملة</button>
<audio id="audio" controls></audio>
</div></div>
<div id="list" class="list"></div><div id="reader"></div>
<script>
if('caches' in window){caches.keys().then(n=>n.forEach(k=>caches.delete(k)));}
if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))}
const listEl=document.getElementById('list'),readerEl=document.getElementById('reader'),audio=document.getElementById('audio'),rec=document.getElementById('rec');
let ayahs=[],cur=-1,curWords=[],timer=null,fs=30;
function changeFont(d){fs+=d;if(fs<18)fs=18;if(fs>64)fs=64;readerEl.style.fontSize=fs+'px';document.getElementById('fl').innerText=fs}
fetch('https://api.alquran.cloud/v1/surah').then(r=>r.json()).then(j=>{j.data.forEach(s=>{let d=document.createElement('div');d.className='surah';d.innerText=s.name;d.onclick=()=>loadSurah(s.number);listEl.appendChild(d)})});
function showList(){readerEl.style.display='none';listEl.style.display='grid';audio.pause();stopLit();}
function stopLit(){clearInterval(timer);document.querySelectorAll('.word.lit').forEach(w=>w.classList.remove('lit'))}
function removeBasmalaFromAyah(text){let t=text.trim();if(t.startsWith('بِسْمِ')||t.startsWith('بسم')||t.includes('ٱلرَّحْمَٰنِ')){let p=t.split('ٱلرَّحِيمِ');if(p.length<2)p=t.split('الرَّحِيمِ');if(p.length>=2){return p[p.length-1].trim();}return t.split(/\s+/).slice(4).join(' ').trim();}return t;}
async function loadSurah(num){listEl.style.display='none';readerEl.style.display='block';readerEl.innerHTML='تحميل...';let res=await fetch(`https://api.alquran.cloud/v1/surah/${num}/${rec.value}?v=99`).then(r=>r.json());ayahs=res.data.ayahs;let html='';if(num!==1&&num!==9){html+=`<div class="basmala">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>`;}ayahs.forEach((a,i)=>{let txt=a.text;if(i===0&&num!==1&&num!==9){txt=removeBasmalaFromAyah(txt);}if(!txt)return;let ws=txt.split(/\s+/).filter(Boolean).map(w=>`<span class="word">${w}</span>`).join(' ');html+=`<span id="a-${i}" onclick="playAyah(${i})">${ws} <span style="opacity:.5;font-size:14px">﴿${a.numberInSurah}﴾</span> </span>`;});readerEl.innerHTML=html;readerEl.style.fontSize=fs+'px';playAyah(0);}
function playAyah(i){cur=i;stopLit();let el=document.getElementById(`a-${i}`);if(!el)return;curWords=el.querySelectorAll('.word');el.scrollIntoView({behavior:'smooth',block:'center'});audio.pause();audio.src=`https://cdn.islamic.network/quran/audio/128/${rec.value}/${ayahs[i].number}.mp3`;audio.load();audio.onloadedmetadata=()=>{audio.play().catch(()=>{});clearInterval(timer);timer=setInterval(()=>{if(!audio.duration)return;let p=audio.currentTime/audio.duration;let wi=Math.floor(p*curWords.length);if(wi>=curWords.length)wi=curWords.length-1;document.querySelectorAll('.word.lit').forEach(x=>x.classList.remove('lit'));if(curWords[wi])curWords[wi].classList.add('lit');},90);};}audio.onended=()=>{stopLit();clearInterval(timer);if(cur+1<ayahs.length)playAyah(cur+1)};
function downloadAyah(){if(cur<0||!ayahs[cur]){alert('شغل آية الأول');return;}let url=`https://cdn.islamic.network/quran/audio/128/${rec.value}/${ayahs[cur].number}.mp3`;let a=document.createElement('a');a.href=url;a.download=`ayah-${ayahs[cur].numberInSurah}.mp3`;document.body.appendChild(a);a.click();a.remove();}
function downloadSurahAll(){if(!ayahs.length){alert('افتح سورة الأول');return;}if(!confirm(`هتحمل ${ayahs.length} آية؟`))return;ayahs.forEach((a,i)=>{setTimeout(()=>{let url=`https://cdn.islamic.network/quran/audio/128/${rec.value}/${a.number}.mp3`;let an=document.createElement('a');an.href=url;an.download=`${String(i+1).padStart(3,'0')}.mp3`;document.body.appendChild(an);an.click();an.remove();},i*700);});}
let deferredPrompt;const installBtn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='inline-block'});installBtn.onclick=async()=>{if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none';}};
</script></body></html>
