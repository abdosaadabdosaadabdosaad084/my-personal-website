<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<style>
body{background:#0f172a;color:#fff;font-family:Tahoma;margin:0;padding:20px;text-align:center}
.card{background:#1e293b;padding:25px;border-radius:20px;margin-top:30px}
.btn{display:block;padding:16px;border-radius:12px;text-decoration:none;font-weight:bold;font-size:18px;margin-top:12px}
.install{background:#22c55e;color:#000;display:none}
</style>
</head>
<body>
<h1 style="color:#22c55e">📖 المصحف الشريف</h1>
<div class="card">
<h2>اختر القراءة</h2>
<a class="btn" style="background:#1e293b;color:#fff;border:1px solid #334155" href="quran-en.html">🇬🇧 Surahs - English</a>
<a class="btn" style="background:#22c55e;color:#000" href="quran-ar.html">🇸🇦 القرآن - عربي</a>
<a class="btn" style="background:#facc15;color:#000" href="tafsir.html">📖 تفسير الميسر</a>
<a id="installBtn" class="btn install">📲 تثبيت التطبيق</a>
<p style="color:#94a3b8;margin-top:15px;font-size:14px">اقرأ واسمع القرآن في أي وقت حتى بدون إنترنت بعد التثبيت</p>
</div>
<script>
let deferredPrompt;
const installBtn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',(e)=>{e.preventDefault();deferredPrompt=e;installBtn.style.display='block';});
installBtn.addEventListener('click',async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();const r=await deferredPrompt.userChoice;deferredPrompt=null;installBtn.style.display='none';});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
