<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2e1f">
<link rel="icon" href="icon.png">
<style>
body{margin:0;font-family:Tahoma;background:#0f2e1f;color:#fff;text-align:center}
#installBar{display:none;background:#ffeb3b;color:#000;padding:12px;position:fixed;bottom:0;width:100%;left:0;z-index:9999;font-weight:bold}
#installBar button{background:#0f2e1f;color:#fff;border:0;padding:8px 18px;border-radius:8px;margin-right:10px}
header{padding:50px 20px}
.logo{width:130px;border-radius:22px}
.btn{display:inline-block;background:#ffeb3b;color:#000;padding:15px 35px;border-radius:12px;text-decoration:none;font-weight:bold;margin:10px;font-size:18px}
</style>
</head>
<body>
<header>
<img src="icon.png" class="logo">
<h1>القرآن الكريم</h1>
<p>استماع وتفسير وتتبع الكلمات</p>
<a class="btn" href="quran-ar.html">📖 ابدأ القراءة - عربي</a>
<br>
<a class="btn" style="background:#fff" href="quran-en.html">English - ابدأ القراءة</a>
</header>

<div id="installBar">
  📖 تثبيت تطبيق القرآن على موبايلك
  <button id="installBtn">تثبيت</button>
</div>

<script>
let deferredPrompt;
const bar=document.getElementById('installBar');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;bar.style.display='block';});
document.getElementById('installBtn').addEventListener('click',async()=>{
  bar.style.display='none';
  if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;}
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}
</script>
</body>
</html>
