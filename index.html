<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>المصحف</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#0b1222;color:#fff;font-family:'Tajawal';padding:16px}
h1{text-align:center;color:#22c55e;margin:16px 0}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:14px;padding:12px;margin:10px 0}
label{color:#94a3b8;font-size:13px}
select{width:100%;background:#1e293b;color:#fff;border:1px solid #334155;padding:12px;border-radius:10px;font-weight:bold;margin-top:6px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grid a{background:#1e293b;border:1px solid #334155;color:#fff;padding:12px;border-radius:10px;text-align:center;text-decoration:none;font-size:13px;font-weight:bold}
.grid a:hover{border-color:#22c55e}
</style>
</head>
<body>
<h1>📖 المصحف الشريف</h1>
<div class="card">
<label>🎙️ اختر القارئ أولا:</label>
<select id="qariSelect">
<option value="ar.alafasy">العفاسي</option>
<option value="ar.husary">الحصري</option>
<option value="ar.minshawi">المنشاوي</option>
<option value="ar.mahermuaiqly">المعيقلي</option>
<option value="ar.tablawi">الطبلاوي</option>
<option value="ar.hatemfarid">حاتم فريد</option>
</select>
</div>
<div class="card"><div id="surahGrid" class="grid"></div></div>
<script>
const surahs=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const qariSel=document.getElementById('qariSelect'),grid=document.getElementById('surahGrid');
let saved=localStorage.getItem('qari'); if(saved) qariSel.value=saved;
qariSel.onchange=()=>localStorage.setItem('qari',qariSel.value);
function render(){
 grid.innerHTML='';
 surahs.forEach((name,i)=>{
  let a=document.createElement('a'); a.textContent=`${i+1}. ${name}`;
  a.href=`quran-ar.html?surah=${i+1}`;
  grid.appendChild(a);
 });
}
render();
</script>
</body>
</html>
