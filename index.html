<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القرآن الكريم - استماع وتفسير</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f2e1f">
<meta property="og:title" content="القرآن الكريم - استماع وتفسير">
<meta property="og:description" content="استمع واقرأ القرآن الكريم كامل مع تتبع الكلمات">
<meta property="og:image" content="https://abdosaadabdosaadabdosaad084.github.io/my-personal-website/icon.png">
<meta property="og:url" content="https://abdosaadabdosaadabdosaad084.github.io/my-personal-website/">
<link rel="icon" href="icon.png">
<style>
body{margin:0;font-family:Tahoma;background:#0f2e1f;color:#fff;text-align:center}
#installBar{display:none;background:#ffeb3b;color:#000;padding:12px;position:fixed;bottom:0;width:100%;left:0;z-index:9999}
#installBar button{background:#0f2e1f;color:#fff;border:0;padding:8px 18px;border-radius:8px;margin-right:10px}
header{padding:40px 20px}
.logo{width:120px;border-radius:20px}
.btn{display:inline-block;background:#ffeb3b;color:#000;padding:15px 30px;border-radius:12px;text-decoration:none;font-weight:bold;margin:15px}
</style>
</head>
<body>
<header>
<img src="icon.png" class="logo">
<h1>القرآن الكريم</h1>
<p>استماع وتفسير وتتبع الكلمات</p>
<a class="btn" href="quran-en.html">ابدأ القراءة</a>
</header>

<div id="installBar">
  📖 تثبيت تطبيق القرآن على موبايلك
  <button id="installBtn">تثبيت</button>
</div>

<script>
let deferredPrompt;
const bar = document.getElementById('installBar');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  bar.style.display = 'block';
});
document.getElementById('installBtn').addEventListener('click', async () => {
  bar.style.display = 'none';
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  }
});
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
