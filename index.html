},{id:"2",url:"https://www.youtube.com/watch?v=9bZkp7q19f0",title:"كيف تبني موقع في يوم واحد",thumb:"https://images.unsplash.com/photo-1517694712202-14dd9538aa97?w=600&q=80"},{id:"3",url:"https://www.youtube.com/watch?v=jNQXAC9IVRw",title:"أسرار السرعة في المواقع",thumb:"https://images.unsplash.com/photo-1508921340878-ba53e1f016ec?w=600&q=80"}],_0=[{id:"1",title:"لماذا الموقع البطيء يقتل مبيعاتك؟",category:"تطوير",cover:"https://images.unsplash.com/photo-1555066931-4365d14bab8c?w=800&q=80",excerpt:"3 ثواني تأخير = خسارة 40% من العملاء. إليك الحل...",content:`السرعة ليست رفاهية. في عالم اليوم، العميل يغلق الصفحة إذا تأخرت ثانيتين.

النتيجة؟ مبيعات أعلى، ترتيب أفضل في جوجل، وتجربة مستخدم تبهر.
