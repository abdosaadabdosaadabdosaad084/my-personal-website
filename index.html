<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>القرآن الكريم - مصحف ملون</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--green:#0f2e1f;--gold:#d4af37;--paper:#fffef5;}
*{box-sizing:border-box}
body{margin:0;background:#f6f1e6;font-family:'Cairo',sans-serif}
.quran-wrap{max-width:900px;margin:20px auto;padding:0 12px}
.quran-card{background:var(--paper);border-radius:24px;border:2px solid var(--gold);box-shadow:0 10px 40px rgba(0,0,0,.15);overflow:hidden}
.quran-header{background:var(--green);color:#f6e27a;padding:18px 20px;text-align:center;border-bottom:3px solid var(--gold)}
.quran-header h1{margin:0;font-family:'Amiri Quran',serif;font-size:28px}
.quran-header p{margin:6px 0 0;font-size:13px;opacity:.9}
.controls{display:flex;gap:10px;padding:14px;background:#fffaf0;border-bottom:1px solid #e8dcc0;flex-wrap:wrap;align-items:center;justify-content:space-between}
.controls select{flex:1;min-width:180px;height:44px;border-radius:999px;border:1.5px solid var(--gold);padding:0 16px;background:white;font-weight:700}
.mushaf{padding:22px;background:linear-gradient(180deg,#fffef5 0%,#fdf8e8 100%);min-height:400px}
.basmala{text-align:center;margin:8px 0 18px;color:#6b4a1a;font-family:'Amiri Quran',serif;font-size:22px}
.surah-title{text-align:center;margin:0 0 12px;font-family:'Amiri Quran',serif;font-size:22px;color:var(--green)}
.ayah-text{font-family:'Amiri Quran',serif;font-size:30px;line-height:2.4;color:#0f2e1f;text-align:justify;word-spacing:3px}
.ayah{cursor:pointer;border-radius:10px;padding:2px 4px;transition:.2s;display:inline}
.ayah:hover{background:#fff3b0}
.ayah.active{background:#0f2e1f;color:#f6e27a !important;border-radius:12px;padding:2px 8px}
.ayah-num{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;margin:0 4px;padding:0 6px;border-radius:999px;background:#fef9e0;border:1.5px solid var(--gold);color:#7a5a10;font-family:'Cairo',sans-serif;font-size:12px;font-weight:800;vertical-align:middle}
.tafsir-box{margin-top:20px;background:#052e1a;border:1.5px solid var(--gold);border-radius:18px;overflow:hidden;display:none}
.tafsir-box.show{display:block}
.tafsir-head{background:#0a3d24;color:#f6e27a;padding:10px 14px;display:flex;justify-content:space-between;align-items:center}
.tafsir-body{padding:14px;color:#ddf5e6;line-height:2;font-size:15px}
.loading{text-align:center;padding:40px;color:#7a5a10}
.footer-note{text-align:center;padding:12px;font-size:11px;color:#7a5a10;background:#fffaf0;border-top:1px solid #e8dcc0}
</style>
</head>
<body>
<div class="quran-wrap">
  <div class="quran-card">
    <div class="quran-header">
      <h1>﴿ القرآن الكريم ﴾</h1>
      <p>برواية حفص عن عاصم - نص عثماني موثق • اضغط على الآية للتفسير فقط</p>
      <p style="font-size:11px;margin-top:4px">﴿ إِنَّا نَحْنُ نَزَّلْنَا الذِّكْرَ وَإِنَّا لَهُ لَحَافِظُونَ ﴾</p>
    </div>
    <div class="controls">
      <select id="surahSelect"><option>جاري تحميل فهرس السور...</option></select>
      <button onclick="loadSurah(currentSurah)" style="height:44px;border-radius:999px;border:none;background:var(--green);color:#f6e27a;padding:0 18px;font-weight:700;cursor:pointer">تحديث</button>
    </div>
    <div class="mushaf" id="mushaf">
      <div class="loading">جاري تحميل القرآن الكريم...</div>
    </div>
    <div id="tafsir" class="tafsir-box">
      <div class="tafsir-head">
        <div><b id="tafsirTitle">التفسير الميسر</b> <span id="tafsirRef" style="font-size:11px;opacity:.8"></span></div>
        <button onclick="closeTafsir()" style="width:28px;height:28px;border-radius:50%;border:none;background:rgba(0,0,0,.2);color:#f6e27a;cursor:pointer">✕</button>
      </div>
      <div class="tafsir-body" id="tafsirBody"></div>
    </div>
    <div class="footer-note">نص قرآني محقق من API مصحف الملك فهد • التفسير: التفسير الميسر • تصميم عبدالله محمد</div>
  </div>
</div>
<script>
let fullList = [];
let currentSurah = 1;
function arabicNum(n){return n.toLocaleString('ar-EG');}
async function init(){
  try{
    const res = await fetch('https://api.alquran.cloud/v1/surah');
    const data = await res.json();
    fullList = data.data;
    const sel = document.getElementById('surahSelect');
    sel.innerHTML = fullList.map(s=>`<option value="${s.number}">${s.number}. سورة ${s.name} - ${s.englishName} (${s.numberOfAyahs} آية)</option>`).join('');
    sel.addEventListener('change', e=>{ currentSurah = parseInt(e.target.value); loadSurah(currentSurah); });
    currentSurah = 1;
    sel.value = 1;
    loadSurah(1);
  }catch(e){
    document.getElementById('mushaf').innerHTML='<div class="loading">تعذر التحميل، حاول تحديث الصفحة</div>';
  }
}
async function loadSurah(num){
  currentSurah = num;
  const mushaf = document.getElementById('mushaf');
  mushaf.innerHTML='<div class="loading">جاري تحميل سورة '+ (fullList.find(s=>s.number==num)?.name || num) +'...</div>';
  closeTafsir();
  try{
    const res = await fetch(`https://api.alquran.cloud/v1/surah/${num}`);
    const data = await res.json();
    const surah = data.data;
    let html = `<div class="surah-title">سورة ${surah.name} • ${surah.revelationType=='Meccan'?'مكية':'مدنية'} • ${arabicNum(surah.numberOfAyahs)} آيات</div>`;
    if(num!==9 && num!==1){
      html+=`<div class="basmala">بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ</div>`;
    }
    html+='<div class="ayah-text" id="ayahContainer">';
    surah.ayahs.forEach(ayah=>{
      html+=`<span class="ayah" onclick="showTafsir(${surah.number},${ayah.numberInSurah})" data-ayah="${ayah.numberInSurah}">${ayah.text} <span class="ayah-num">${arabicNum(ayah.numberInSurah)}</span> </span>`;
    });
    html+='</div>';
    mushaf.innerHTML=html;
  }catch(err){
    mushaf.innerHTML='<div class="loading">خطأ في تحميل السورة</div>';
  }
}
async function showTafsir(surahNum, ayahNum){
  document.querySelectorAll('.ayah').forEach(el=>el.classList.remove('active'));
  const el = document.querySelector(`.ayah[data-ayah="${ayahNum}"]`);
  if(el) el.classList.add('active');
  const box = document.getElementById('tafsir');
  const body = document.getElementById('tafsirBody');
  const ref = document.getElementById('tafsirRef');
  box.classList.add('show');
  ref.textContent = `سورة ${fullList.find(s=>s.number==surahNum)?.name || surahNum} - الآية ${arabicNum(ayahNum)}`;
  body.innerHTML='جاري تحميل التفسير الميسر...';
  try{
    const res = await fetch(`https://api.alquran.cloud/v1/ayah/${surahNum}:${ayahNum}/ar.muyassar`);
    const data = await res.json();
    body.textContent = data.data.text;
    box.scrollIntoView({behavior:'smooth', block:'nearest'});
  }catch(e){
    body.textContent='تعذر تحميل التفسير، حاول مرة أخرى.';
  }
}
function closeTafsir(){
  document.getElementById('tafsir').classList.remove('show');
  document.querySelectorAll('.ayah').forEach(el=>el.classList.remove('active'));
}
init();
</script>
</body>
</html>
